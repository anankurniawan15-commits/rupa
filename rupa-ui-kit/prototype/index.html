<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rupa — Prototipe UI</title>
<link rel="icon" href="assets/brand/rupa-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Poppins:wght@600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>body{margin:0}</style>
</head>
<body>
<div id="root"></div>
<!-- Markup template: {{ }} = data dari renderVals(), sc-if = kondisi, sc-for = perulangan -->
<template id="tpl">
<div class="app" ref="{{ rootRef }}">
<a class="skip" href="#main">Lewati ke konten utama</a>

<sc-if value="{{ showBanner }}" hint-placeholder-val="{{ true }}">
<div class="demo-bar" role="note"><div class="wrap"><span>Prototipe desain — semua produk, penjual, ulasan, dan transaksi di sini adalah data contoh.</span><button class="iconbtn" onClick="{{ hideBanner }}" aria-label="Tutup pemberitahuan prototipe"><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>
</sc-if>

<header class="hdr">
<div class="hdr-in">
<button class="iconbtn only-nav" onClick="{{ toggleMenu }}" aria-label="Buka menu" aria-expanded="{{ menuOpen }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<button class="brand" onClick="{{ nav.home }}" aria-label="Rupa, ke Beranda">
<img class="brand-mark" src="assets/brand/rupa-mark.png" alt="" width="31" height="40">
<span class="wm">Rupa.</span>
</button>
<nav class="hdr-nav" aria-label="Navigasi utama">
<button class="{{ navCls.home }}" aria-current="{{ navCur.home }}" onClick="{{ nav.home }}">Beranda</button>
<button class="{{ navCls.explore }}" aria-current="{{ navCur.explore }}" onClick="{{ nav.explore }}">Jelajahi</button>
<button class="{{ navCls.sortir }}" aria-current="{{ navCur.sortir }}" onClick="{{ nav.sortir }}">Sortir dengan AI</button>
<button class="{{ navCls.sell }}" aria-current="{{ navCur.sell }}" onClick="{{ nav.sell }}">Jual Produk</button>
</nav>
<form class="hdr-search" role="search" onSubmit="{{ onHeaderSubmit }}">
<label for="hq" class="sr">Cari produk, material, atau kegunaan</label>
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
<input id="hq" type="search" placeholder="Cari tote denim, lampu kayu, hadiah…" value="{{ headerQ }}" onChange="{{ onHeaderQ }}">
</form>
<div class="hdr-actions">
<button class="iconbtn only-m" onClick="{{ nav.explore }}" aria-label="Cari produk"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
<button class="iconbtn" onClick="{{ nav.wishlist }}" aria-label="{{ wishLabel }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><sc-if value="{{ hasWish }}" hint-placeholder-val="{{ true }}"><span class="badge" aria-hidden="true">{{ wishCount }}</span></sc-if></button>
<button class="iconbtn" onClick="{{ nav.cart }}" aria-label="{{ cartLabel }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><sc-if value="{{ hasCart }}" hint-placeholder-val="{{ true }}"><span class="badge" aria-hidden="true">{{ cartCount }}</span></sc-if></button>
<sc-if value="{{ me.out }}" hint-placeholder-val="{{ false }}">
<div class="row gap-8 center hdr-auth"><button class="btn btn-ghost btn-sm" onClick="{{ nav.login }}">Masuk</button><button class="btn btn-primary btn-sm hide-m" onClick="{{ nav.register }}">Daftar</button></div>
</sc-if>
<sc-if value="{{ me.in }}" hint-placeholder-val="{{ true }}">
<div class="pmenu hide-m">
<button class="avatar-btn" onClick="{{ toggleProfile }}" aria-expanded="{{ profileOpen }}" aria-haspopup="menu" aria-label="Menu akun {{ me.name }}">{{ me.initials }}</button>
<sc-if value="{{ profileOpen }}" hint-placeholder-val="{{ false }}">
<div class="pmenu-pop" role="menu" aria-label="Menu akun">
<div class="pm-head"><b>{{ me.name }}</b><span class="fine">{{ me.sub }}</span></div>
<sc-if value="{{ me.isAdmin }}" hint-placeholder-val="{{ false }}"><button role="menuitem" onClick="{{ nav.admin }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>Panel Admin</button></sc-if>
<button role="menuitem" onClick="{{ nav.orders }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7l8-4 8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg>Pesanan Saya</button>
<button role="menuitem" onClick="{{ nav.wishlist }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Wishlist</button>
<sc-if value="{{ me.isSeller }}" hint-placeholder-val="{{ true }}"><button role="menuitem" onClick="{{ nav.dash }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9l1-5h14l1 5M4 9v11h16V9M4 9h16"/></svg>Dashboard Penjual</button></sc-if>
<sc-if value="{{ me.notSeller }}" hint-placeholder-val="{{ false }}"><button role="menuitem" onClick="{{ nav.openShop }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9l1-5h14l1 5M4 9v11h16V9M4 9h16"/><path d="M12 12v5M9.5 14.5h5"/></svg>Buka Toko</button></sc-if>
<button role="menuitem" onClick="{{ nav.assistant }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>AI Assistant</button>
<button role="menuitem" onClick="{{ nav.profile }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profil dan Pengaturan</button>
<button role="menuitem" onClick="{{ logout }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10"/></svg>Keluar</button>
</div>
</sc-if>
</div>
</sc-if>
</div>
</div>
</header>

<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
<div class="drawer-ov" onClick="{{ toggleMenu }}"></div>
<nav class="drawer" aria-label="Menu">
<div class="row between center" style="margin-bottom: 8px"><span class="row gap-8 center"><img class="brand-mark" src="assets/brand/rupa-mark.png" alt="" width="31" height="40"><span class="wm">Rupa.</span></span><button class="iconbtn" onClick="{{ toggleMenu }}" aria-label="Tutup menu"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<button class="dl" onClick="{{ nav.home }}">Beranda</button>
<button class="dl" onClick="{{ nav.explore }}">Jelajahi Produk</button>
<button class="dl" onClick="{{ nav.sortir }}">Sortir dengan AI</button>
<button class="dl" onClick="{{ nav.assistant }}">AI Assistant</button>
<button class="dl" onClick="{{ nav.sell }}">Jual Produk</button>
<hr>
<sc-if value="{{ me.out }}" hint-placeholder-val="{{ false }}">
<div class="col gap-8" style="padding: 8px 4px"><button class="btn btn-primary w100" onClick="{{ nav.login }}">Masuk</button><button class="btn btn-secondary w100" onClick="{{ nav.register }}">Daftar akun baru</button></div>
</sc-if>
<sc-if value="{{ me.in }}" hint-placeholder-val="{{ true }}">
<div class="col" style="padding: 4px 12px 8px"><b>{{ me.name }}</b><span class="fine">{{ me.sub }}</span></div>
<sc-if value="{{ me.isAdmin }}" hint-placeholder-val="{{ false }}"><button class="dl" onClick="{{ nav.admin }}">Panel Admin</button></sc-if>
<button class="dl" onClick="{{ nav.orders }}">Pesanan Saya</button>
<button class="dl" onClick="{{ nav.wishlist }}">Wishlist ({{ wishCount }})</button>
<sc-if value="{{ me.isSeller }}" hint-placeholder-val="{{ true }}"><button class="dl" onClick="{{ nav.dash }}">Dashboard Penjual</button></sc-if>
<sc-if value="{{ me.notSeller }}" hint-placeholder-val="{{ false }}"><button class="dl" onClick="{{ nav.openShop }}">Buka Toko</button></sc-if>
<button class="dl" onClick="{{ nav.profile }}">Profil dan Pengaturan</button>
<button class="dl" onClick="{{ logout }}">Keluar</button>
</sc-if>
</nav>
</sc-if>

<main id="main" class="main">

<sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
<div>
<section class="hero wrap" aria-labelledby="hero-t">
<div class="hero-copy">
<p class="eyebrow">Marketplace upcycle · Indonesia</p>
<h1 id="hero-t" class="display">Barang Lama.<br><em>Cerita Baru.</em></h1>
<p class="lede">Temukan karya upcycle unik atau ubah barang tak terpakai menjadi sesuatu yang bernilai.</p>
<div class="row gap-12 wrapf">
<button class="btn btn-primary btn-lg" onClick="{{ nav.explore }}">Jelajahi Produk</button>
<button class="btn btn-secondary btn-lg" onClick="{{ nav.sortir }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><path d="M8 12h8"/></svg>Sortir Barang dengan AI</button>
</div>
<ul class="hero-facts">
<li><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Material asal dan proses pembuatan tercantum di setiap listing</li>
<li><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Dijual langsung oleh pembuatnya — dari Jepara sampai Surabaya</li>
<li><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Ulasan hanya dari pembeli yang pesanannya selesai</li>
</ul>
</div>
<div class="hero-art">
<figure class="ha ha-1"><button onClick="{{ home.openKulot }}" aria-label="Lihat Kulot Patchwork Bintang"><img src="assets/products/kulot-patchwork.jpg" alt="Kulot lebar dari panel corduroy, flanel kotak-kotak, dan aplikasi bintang perca"></button><figcaption><span class="mono">No. 03</span><span>Kulot patchwork — dari celana corduroy dan kemeja flanel bekas</span></figcaption></figure>
<figure class="ha"><button onClick="{{ home.openTote }}" aria-label="Lihat Tote Kanvas Saku Denim"><img src="assets/products/tote-saku-denim.jpg" alt="Saku jeans bekas sedang disematkan ke tote kanvas"></button><figcaption><span class="mono">No. 01</span><span>Saku jeans bekas, dijahit ulang ke kanvas sisa</span></figcaption></figure>
<figure class="ha"><button onClick="{{ home.openJaket }}" aria-label="Lihat Jaket Denim Belah Dua"><img src="assets/products/jaket-denim-belah-dua.jpg" alt="Jaket denim dua tone, separuh indigo separuh biru muda"></button><figcaption><span class="mono">No. 05</span><span>Dua jaket denim, satu badan</span></figcaption></figure>
</div>
</section>

<section class="wrap sec" aria-labelledby="sec-pilihan">
<div class="sec-head"><div><div class="sec-t"><span class="sec-n">01</span><h2 id="sec-pilihan" class="h2">Produk Pilihan</h2></div><p class="sec-sub">Dipilih karena cerita bahannya jelas dan pengerjaannya rapi.</p></div><button class="link-arrow" onClick="{{ nav.explore }}">Lihat semua produk<svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
<div class="feat">
<article class="lead">
<div class="pc-media"><button class="pc-open" onClick="{{ home.lead.open }}" aria-label="Lihat detail {{ home.lead.title }}"><img class="pc-img" src="{{ home.lead.img }}" alt="{{ home.lead.alt }}"></button><button class="{{ home.lead.favCls }}" onClick="{{ home.lead.fav }}" aria-pressed="{{ home.lead.isFav }}" aria-label="{{ home.lead.favLabel }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button></div>
<div class="col gap-12">
<span class="mat-tag"><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6M20 12a8 8 0 0 1-13.7 5.6"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>Pilihan minggu ini · {{ home.lead.matShort }}</span>
<h3 class="lead-t"><button class="linkbtn" onClick="{{ home.lead.open }}">{{ home.lead.title }}</button></h3>
<p class="story">Nadya dari Studio Tambal membongkar celana corduroy dan kemeja flanel bekas per panel, lalu menyusunnya ulang. Bintang di kakinya dijahit tangan dari perca sisa penjahit langganannya. Hanya ada satu.</p>
<div class="row between center wrapf gap-12"><p class="pc-price">{{ home.lead.priceTxt }}</p><p class="pc-seller"><span class="av">{{ home.lead.initials }}</span><span class="t">{{ home.lead.sellerName }} · {{ home.lead.city }}</span></p></div>
<button class="btn btn-secondary" onClick="{{ home.lead.open }}">Baca cerita lengkapnya</button>
</div>
</article>
<div class="grid-3">
<sc-for list="{{ home.rest }}" as="p" hint-placeholder-count="3">
<article class="pc">
<div class="pc-media">
<button class="pc-open" onClick="{{ p.open }}" aria-label="Lihat detail {{ p.title }}"><sc-if value="{{ p.hasImg }}" hint-placeholder-val="{{ true }}"><img class="pc-img" src="{{ p.img }}" alt="{{ p.alt }}"></sc-if><sc-if value="{{ p.noImg }}" hint-placeholder-val="{{ false }}"><span class="{{ p.phCls }}"><span class="ph-tag">{{ p.phLabel }}</span></span></sc-if></button>
<button class="{{ p.favCls }}" onClick="{{ p.fav }}" aria-pressed="{{ p.isFav }}" aria-label="{{ p.favLabel }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
</div>
<div class="pc-body">
<span class="mat-tag"><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6M20 12a8 8 0 0 1-13.7 5.6"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>{{ p.matShort }}</span>
<h3 class="pc-title"><button class="linkbtn" onClick="{{ p.open }}">{{ p.title }}</button></h3>
<p class="pc-price">{{ p.priceTxt }}</p>
<p class="pc-seller"><span class="av">{{ p.initials }}</span><span class="t">{{ p.sellerName }} · {{ p.city }}</span></p>
</div>
</article>
</sc-for>
</div>
</div>
</section>

<section class="wrap sec" aria-labelledby="sec-baru" style="padding-top: 8px">
<div class="sec-head"><div><div class="sec-t"><span class="sec-n">02</span><h2 id="sec-baru" class="h2">Baru di Rupa</h2></div><p class="sec-sub">Listing terbaru dari para pembuat.</p></div><button class="link-arrow" onClick="{{ home.seeNewest }}">Urutkan dari terbaru<svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
<div class="rail" role="list">
<sc-for list="{{ home.newest }}" as="p" hint-placeholder-count="5">
<div role="listitem">
<article class="pc">
<div class="pc-media">
<button class="pc-open" onClick="{{ p.open }}" aria-label="Lihat detail {{ p.title }}"><sc-if value="{{ p.hasImg }}" hint-placeholder-val="{{ true }}"><img class="pc-img" src="{{ p.img }}" alt="{{ p.alt }}"></sc-if><sc-if value="{{ p.noImg }}" hint-placeholder-val="{{ false }}"><span class="{{ p.phCls }}"><span class="ph-tag">{{ p.phLabel }}</span></span></sc-if></button>
<button class="{{ p.favCls }}" onClick="{{ p.fav }}" aria-pressed="{{ p.isFav }}" aria-label="{{ p.favLabel }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
</div>
<div class="pc-body">
<span class="mat-tag"><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6M20 12a8 8 0 0 1-13.7 5.6"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>{{ p.matShort }}</span>
<h3 class="pc-title"><button class="linkbtn" onClick="{{ p.open }}">{{ p.title }}</button></h3>
<p class="pc-price">{{ p.priceTxt }}</p>
<p class="pc-seller"><span class="av">{{ p.initials }}</span><span class="t">{{ p.sellerName }} · {{ p.city }}</span></p>
</div>
</article>
</div>
</sc-for>
</div>
</section>

<section class="aiband" aria-labelledby="sec-ai">
<div class="wrap aiband-in">
<div>
<p class="eyebrow on-dark">03 · AI Sortir Barang</p>
<h2 id="sec-ai" class="h2">Jangan buru-buru membuangnya.</h2>
<p>Unggah foto barang yang tak terpakai. AI Sortir memperkirakan materialnya, mencatat kondisi yang terlihat di foto, lalu menyarankan langkah berikutnya: dipakai lagi, diperbaiki, di-upcycle, dijual sebagai bahan, atau disalurkan ke jalur daur ulang.</p>
<ol class="steps-mini">
<li>Unggah foto, atau jelaskan barangnya dengan teks</li>
<li>Lihat perkiraan material dan kondisi, lengkap dengan tingkat keyakinan</li>
<li>Pilih langkah dan dapatkan tiga ide pemanfaatan</li>
<li>Temukan kreator atau pembeli yang membutuhkan materialnya</li>
</ol>
<div class="row gap-12 wrapf center"><button class="btn btn-ai btn-lg" onClick="{{ nav.sortir }}">Coba AI Sortir</button><span class="fine on-dark">Hasilnya perkiraan dari foto — bukan uji laboratorium.</span></div>
</div>
<figure class="specimen" style="margin: 0">
<img src="assets/products/tote-saku-denim-detail.jpg" alt="Contoh foto yang dianalisis: saku jeans di atas kain kanvas">
<span class="mark d1" aria-hidden="true"></span><span class="mark d2" aria-hidden="true"></span>
<span class="anno a1"><b>Material</b>Tekstil — denim (perkiraan)</span>
<span class="anno a2"><b>Kondisi terlihat</b>Jahitan utuh, warna pudar merata</span>
<span class="anno a3"><b>Langkah disarankan</b>Upcycle sendiri atau jual sebagai bahan</span>
<figcaption class="spec-foot"><span>Contoh hasil analisis</span><span>Keyakinan: tinggi</span></figcaption>
</figure>
</div>
</section>

<section class="wrap sec" aria-labelledby="sec-murah">
<div class="sec-head"><div><div class="sec-t"><span class="sec-n">04</span><h2 id="sec-murah" class="h2">Temuan Unik di Bawah Rp100.000</h2></div><p class="sec-sub">Kecil, berguna, dan cocok untuk hadiah pertama dari barang bekas.</p></div><button class="link-arrow" onClick="{{ home.seeUnder }}">Lihat semua di bawah Rp100.000<svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
<div class="rail" role="list">
<sc-for list="{{ home.under }}" as="p" hint-placeholder-count="5">
<div role="listitem">
<article class="pc">
<div class="pc-media">
<button class="pc-open" onClick="{{ p.open }}" aria-label="Lihat detail {{ p.title }}"><sc-if value="{{ p.hasImg }}" hint-placeholder-val="{{ true }}"><img class="pc-img" src="{{ p.img }}" alt="{{ p.alt }}"></sc-if><sc-if value="{{ p.noImg }}" hint-placeholder-val="{{ false }}"><span class="{{ p.phCls }}"><span class="ph-tag">{{ p.phLabel }}</span></span></sc-if></button>
<button class="{{ p.favCls }}" onClick="{{ p.fav }}" aria-pressed="{{ p.isFav }}" aria-label="{{ p.favLabel }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
</div>
<div class="pc-body">
<span class="mat-tag"><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6M20 12a8 8 0 0 1-13.7 5.6"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>{{ p.matShort }}</span>
<h3 class="pc-title"><button class="linkbtn" onClick="{{ p.open }}">{{ p.title }}</button></h3>
<p class="pc-price">{{ p.priceTxt }}</p>
<p class="pc-seller"><span class="av">{{ p.initials }}</span><span class="t">{{ p.sellerName }} · {{ p.city }}</span></p>
</div>
</article>
</div>
</sc-for>
</div>
</section>

<section class="wrap sec" aria-labelledby="sec-minat" style="padding-top: 8px">
<div class="sec-head"><div><div class="sec-t"><span class="sec-n">05</span><h2 id="sec-minat" class="h2">Pilihan Berdasarkan Minat</h2></div><p class="sec-sub">Pilih minatmu — rekomendasi di bawah menyesuaikan.</p></div></div>
<div class="chips" role="group" aria-label="Minat" style="margin-bottom: 28px">
<sc-for list="{{ home.interests }}" as="c" hint-placeholder-count="4"><button class="{{ c.cls }}" aria-pressed="{{ c.on }}" onClick="{{ c.pick }}">{{ c.label }}</button></sc-for>
</div>
<div class="grid-4">
<sc-for list="{{ home.interestList }}" as="p" hint-placeholder-count="4">
<article class="pc">
<div class="pc-media">
<button class="pc-open" onClick="{{ p.open }}" aria-label="Lihat detail {{ p.title }}"><sc-if value="{{ p.hasImg }}" hint-placeholder-val="{{ true }}"><img class="pc-img" src="{{ p.img }}" alt="{{ p.alt }}"></sc-if><sc-if value="{{ p.noImg }}" hint-placeholder-val="{{ false }}"><span class="{{ p.phCls }}"><span class="ph-tag">{{ p.phLabel }}</span></span></sc-if></button>
<button class="{{ p.favCls }}" onClick="{{ p.fav }}" aria-pressed="{{ p.isFav }}" aria-label="{{ p.favLabel }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
</div>
<div class="pc-body">
<span class="mat-tag"><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6M20 12a8 8 0 0 1-13.7 5.6"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>{{ p.matShort }}</span>
<h3 class="pc-title"><button class="linkbtn" onClick="{{ p.open }}">{{ p.title }}</button></h3>

<span class="verified"><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Pembelian terverifikasi</span>
<p>{{ r.text }}</p>
</article>
</sc-for>
</div>
</div>
</section>

<section class="pd-story" aria-labelledby="pd-terkait">
<h2 id="pd-terkait" class="h2" style="margin-bottom: 24px">Mungkin kamu suka</h2>
<div class="grid-4">
<sc-for list="{{ pd.related }}" as="p" hint-placeholder-count="4">
<article class="pc">
<div class="pc-media">
<button class="pc-open" onClick="{{ p.open }}" aria-label="Lihat detail {{ p.title }}"><sc-if value="{{ p.hasImg }}" hint-placeholder-val="{{ true }}"><img class="pc-img" src="{{ p.img }}" alt="{{ p.alt }}"></sc-if><sc-if value="{{ p.noImg }}" hint-placeholder-val="{{ false }}"><span class="{{ p.phCls }}"><span class="ph-tag">{{ p.phLabel }}</span></span></sc-if></button>
<button class="{{ p.favCls }}" onClick="{{ p.fav }}" aria-pressed="{{ p.isFav }}" aria-label="{{ p.favLabel }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
</div>
<div class="pc-body">
<span class="mat-tag"><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6M20 12a8 8 0 0 1-13.7 5.6"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>{{ p.matShort }}</span>
<h3 class="pc-title"><button class="linkbtn" onClick="{{ p.open }}">{{ p.title }}</button></h3>
<p class="pc-price">{{ p.priceTxt }}</p>
<p class="pc-seller"><span class="av">{{ p.initials }}</span><span class="t">{{ p.sellerName }} · {{ p.city }}</span></p>
</div>
</article>
</sc-for>
</div>
</section>
</div>
</sc-if>

<sc-if value="{{ isSortir }}" hint-placeholder-val="{{ false }}">
<div class="page wrap">
<header class="so-head">
<p class="eyebrow">AI Sortir Barang</p>
<h1 class="h1">Barang ini masih bisa jadi apa?</h1>
<p class="lede" style="max-width: 60ch">Unggah foto barang yang tak terpakai. Kamu akan mendapat perkiraan material, catatan kondisi yang terlihat, dan pilihan langkah berikutnya — lengkap dengan batasan analisisnya.</p>
</header>
<ol class="stepper-h" aria-label="Langkah AI Sortir">
<sc-for list="{{ so.steps }}" as="s" hint-placeholder-count="5"><li class="{{ s.cls }}"><button onClick="{{ s.go }}" disabled="{{ s.locked }}" aria-current="{{ s.cur }}"><span class="st-n">{{ s.n }}</span><span class="st-l">{{ s.label }}</span></button></li></sc-for>
</ol>
<p class="cur-label only-m">{{ so.curLabel }}</p>

<sc-if value="{{ so.isStep1 }}" hint-placeholder-val="{{ true }}">
<div>
<sc-if value="{{ so.isIdle }}" hint-placeholder-val="{{ true }}">
<div class="so-grid">
<div>
<input id="sofile" class="sr" type="file" accept="image/jpeg,image/png,image/webp" onChange="{{ so.onFile }}">
<label class="{{ so.dropCls }}" for="sofile" onDragOver="{{ so.onDragOver }}" onDragLeave="{{ so.onDragLeave }}" onDrop="{{ so.onDrop }}">
<span class="dz-icon"><svg class="ic ic-l" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v4h16v-4"/></svg></span>
<span class="dz-t hide-m">Tarik dan lepas foto barang di sini</span>
<span class="dz-t only-m">Foto barangmu</span>
<span class="dz-s">JPG, PNG, atau WebP · maks. 10 MB · satu barang per foto</span>
<span class="btn btn-primary hide-m">Pilih foto dari komputer</span>
</label>
<div class="only-m row gap-8 mt-16 w100">
<input id="socam" class="sr" type="file" accept="image/*" capture="environment" onChange="{{ so.onFile }}">
<label for="socam" class="btn btn-primary grow"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Kamera</label>
<label for="sofile" class="btn btn-secondary grow"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-8 8"/></svg>Galeri</label>
</div>
<sc-if value="{{ so.hasFileErr }}" hint-placeholder-val="{{ false }}"><p class="err mt-8" role="alert"><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>{{ so.fileErr }}</p></sc-if>
<p class="privacy"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/></svg><span>Foto hanya dipakai untuk analisis ini dan tidak tampil ke pengguna lain. Kamu bisa menyimpan hasilnya (tanpa foto) ke profil. Hindari foto yang memperlihatkan wajah, alamat, atau dokumen pribadi.</span></p>
</div>
<div>
<h2 class="h4">Belum punya foto? Coba contoh ini</h2>
<p class="help">Setiap contoh menunjukkan satu kondisi hasil yang berbeda.</p>
<div class="samples">
<sc-for list="{{ so.samples }}" as="s" hint-placeholder-count="6"><button class="sample" onClick="{{ s.pick }}"><span class="sample-img"><sc-if value="{{ s.hasImg }}" hint-placeholder-val="{{ true }}"><img src="{{ s.img }}" alt="" class="{{ s.imgCls }}"></sc-if><sc-if value="{{ s.noImg }}" hint-placeholder-val="{{ false }}"><span class="{{ s.phCls }}"></span></sc-if></span><span class="sample-l">{{ s.label }}</span><span class="sample-n">{{ s.note }}</span></button></sc-for>
</div>
<form class="manual" onSubmit="{{ so.manualSubmit }}">
<label for="somanual" class="h4">Tidak bisa memotret? Jelaskan barangnya</label>
<textarea id="somanual" class="input" rows="3" value="{{ so.manual }}" onChange="{{ so.onManual }}" placeholder="Contoh: celana jeans biru ukuran 30, robek di lutut kiri, jahitan saku masih bagus"></textarea>
<sc-if value="{{ so.hasManualErr }}" hint-placeholder-val="{{ false }}"><p class="err" role="alert">{{ so.manualErr }}</p></sc-if>
<div><button class="btn btn-secondary" type="submit">Analisis dari deskripsi</button></div>
</form>
</div>
</div>
</sc-if>

<sc-if value="{{ so.isPreview }}" hint-placeholder-val="{{ false }}">
<div class="preview">
<div class="frame">
<sc-if value="{{ so.vis.hasImg }}" hint-placeholder-val="{{ true }}"><img src="{{ so.vis.img }}" alt="{{ so.vis.alt }}" class="{{ so.vis.imgCls }}"></sc-if>
<sc-if value="{{ so.vis.isPh }}" hint-placeholder-val="{{ false }}"><span class="{{ so.vis.phCls }}"><span class="ph-tag">{{ so.vis.phLabel }}</span></span></sc-if>
<sc-if value="{{ so.vis.isText }}" hint-placeholder-val="{{ false }}"><div class="txt-src"><p class="mono-label">Deskripsimu</p><p>“{{ so.vis.text }}”</p></div></sc-if>
</div>
<div class="col gap-16">
<h2 class="h2">Siap dianalisis</h2>
<p class="muted">{{ so.vis.label }}</p>
<ul class="checks">
<li><svg class="ic ok-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Satu barang per foto, terlihat utuh</li>
<li><svg class="ic ok-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Cahaya cukup, tidak buram</li>
<li><svg class="ic ok-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Bagian yang rusak ikut terlihat</li>
</ul>
<div class="row gap-8 wrapf">
<button class="btn btn-ai btn-lg" onClick="{{ so.analyze }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><path d="M8 12h8"/></svg>Mulai analisis</button>
<input id="soreplace" class="sr" type="file" accept="image/jpeg,image/png,image/webp" onChange="{{ so.onFile }}">
<label for="soreplace" class="btn btn-secondary btn-lg">Ganti foto</label>
<button class="btn btn-ghost btn-lg" onClick="{{ so.removeImg }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>Hapus</button>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{ so.isLoading }}" hint-placeholder-val="{{ false }}">
<div class="preview" aria-busy="true">
<div class="frame">
<sc-if value="{{ so.vis.hasImg }}" hint-placeholder-val="{{ true }}"><img src="{{ so.vis.img }}" alt="{{ so.vis.alt }}" class="{{ so.vis.imgCls }}"></sc-if>
<sc-if value="{{ so.vis.isPh }}" hint-placeholder-val="{{ false }}"><span class="{{ so.vis.phCls }}"><span class="ph-tag">{{ so.vis.phLabel }}</span></span></sc-if>
<sc-if value="{{ so.vis.isText }}" hint-placeholder-val="{{ false }}"><div class="txt-src"><p class="mono-label">Deskripsimu</p><p>“{{ so.vis.text }}”</p></div></sc-if>
<span class="scanline" aria-hidden="true"></span>
</div>
<div>
<h2 class="h2">Menganalisis…</h2>
<ul class="load-lines" aria-live="polite">
<sc-for list="{{ so.loadLines }}" as="l" hint-placeholder-count="3"><li class="{{ l.cls }}"><sc-if value="{{ l.isDone }}" hint-placeholder-val="{{ false }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></sc-if><sc-if value="{{ l.isNow }}" hint-placeholder-val="{{ true }}"><span class="spin" aria-hidden="true"></span></sc-if><sc-if value="{{ l.isWait }}" hint-placeholder-val="{{ false }}"><span class="dotwait" aria-hidden="true"></span></sc-if>{{ l.text }}</li></sc-for>
</ul>
<div class="col gap-8" aria-hidden="true"><div class="skel" style="width: 70%"></div><div class="skel" style="width: 90%"></div><div class="skel" style="width: 55%"></div></div>
<button class="btn btn-ghost mt-24" onClick="{{ so.removeImg }}">Batalkan</button>
</div>
</div>
</sc-if>

<sc-if value="{{ so.isUnsupported }}" hint-placeholder-val="{{ false }}">
<div class="state-card" role="alert">
<span class="state-ic"><svg class="ic ic-l" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M4 4l16 16"/></svg></span>
<h2 class="h2">Foto ini belum bisa kami analisis</h2>
<p class="muted">Sepertinya ini tangkapan layar atau bukan foto barang fisik. AI Sortir bekerja paling baik dengan satu barang nyata yang difoto utuh dengan cahaya cukup.</p>
<div class="row gap-8 wrapf"><button class="btn btn-primary" onClick="{{ so.removeImg }}">Unggah foto lain</button><button class="btn btn-secondary" onClick="{{ so.toManual }}">Jelaskan dengan teks</button></div>
</div>
</sc-if>

<sc-if value="{{ so.isError }}" hint-placeholder-val="{{ false }}">
<div class="state-card" role="alert">
<span class="state-ic err"><svg class="ic ic-l" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg></span>
<h2 class="h2">Analisis gagal dimuat</h2>
<p class="muted">Koneksi ke layanan analisis terputus sebelum hasilnya selesai. Fotomu belum disimpan di mana pun. Coba lagi dalam beberapa saat.</p>
<div class="row gap-8 wrapf"><button class="btn btn-primary" onClick="{{ so.retry }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>Coba lagi</button><button class="btn btn-secondary" onClick="{{ so.toManual }}">Jelaskan dengan teks</button><button class="btn btn-ghost" onClick="{{ so.removeImg }}">Kembali</button></div>
</div>
</sc-if>

<sc-if value="{{ so.isUploadChoice }}" hint-placeholder-val="{{ false }}">
<div class="preview">
<div class="frame"><sc-if value="{{ so.vis.hasImg }}" hint-placeholder-val="{{ true }}"><img src="{{ so.vis.img }}" alt="{{ so.vis.alt }}" class="{{ so.vis.imgCls }}"></sc-if></div>
<div class="col gap-16">
<span class="tag tag-est" style="align-self: flex-start">Mode prototipe</span>
<h2 class="h2">Fotomu terunggah — tapi AI belum benar-benar membacanya</h2>
<p class="muted">Prototipe ini belum terhubung ke model analisis gambar. Pilih jenis barang yang paling mirip untuk melihat bagaimana hasilnya akan ditampilkan. Hasilnya akan diberi label “contoh”.</p>
<div class="chips"><sc-for list="{{ so.uploadPicks }}" as="c" hint-placeholder-count="3"><button class="chip" onClick="{{ c.pick }}">{{ c.label }}</button></sc-for></div>
<div><button class="btn btn-ghost" onClick="{{ so.removeImg }}">Pilih foto lain</button></div>
</div>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{ so.isStep2 }}" hint-placeholder-val="{{ false }}">
<div>
<sc-if value="{{ so.isLow }}" hint-placeholder-val="{{ false }}">
<div class="res">
<div class="res-img"><div class="frame">
<sc-if value="{{ so.vis.hasImg }}" hint-placeholder-val="{{ true }}"><img src="{{ so.vis.img }}" alt="{{ so.vis.alt }}" class="{{ so.vis.imgCls }}"></sc-if>
<sc-if value="{{ so.vis.isPh }}" hint-placeholder-val="{{ false }}"><span class="{{ so.vis.phCls }}"><span class="ph-tag">{{ so.vis.phLabel }}</span></span></sc-if>
<sc-if value="{{ so.vis.isText }}" hint-placeholder-val="{{ false }}"><div class="txt-src"><p class="mono-label">Deskripsimu</p><p>“{{ so.vis.text }}”</p></div></sc-if>
</div></div>
<div class="res-main">
<div class="col gap-8"><span class="tag tag-warn" style="align-self: flex-start">Keyakinan rendah</span><h2 class="h2">Kami belum yakin ini material apa</h2></div>
<div class="conf"><div class="conf-l"><span>Keyakinan</span><b>Rendah · sekitar 30%</b></div><div class="meter" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="30" aria-label="Tingkat keyakinan"><span class="cf-lo" style="width: 30%"></span></div><p class="fine">{{ so.lowReason }}</p></div>
<div class="col gap-12">
<h3 class="h4">Bantu kami: barang ini paling mirip apa?</h3>
<div class="chips"><sc-for list="{{ so.lowPicks }}" as="c" hint-placeholder-count="3"><button class="chip" onClick="{{ c.pick }}">{{ c.label }}</button></sc-for></div>
</div>
<div class="notice"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Tips foto ulang: letakkan barang di permukaan polos, foto dari jarak 30–50 cm, dan pastikan seluruh barang masuk bingkai.</span></div>
<div class="row gap-8 wrapf"><button class="btn btn-secondary" onClick="{{ so.removeImg }}">Foto ulang</button><button class="btn btn-ghost" onClick="{{ so.toManual }}">Jelaskan dengan teks</button></div>
</div>
</div>
</sc-if>
<sc-if value="{{ so.hasResult }}" hint-placeholder-val="{{ true }}">
<div class="res">
<div class="res-img">
<div class="frame">
<sc-if value="{{ so.vis.hasImg }}" hint-placeholder-val="{{ true }}"><img src="{{ so.vis.img }}" alt="{{ so.vis.alt }}" class="{{ so.vis.imgCls }}"></sc-if>
<sc-if value="{{ so.vis.isPh }}" hint-placeholder-val="{{ false }}"><span class="{{ so.vis.phCls }}"><span class="ph-tag">{{ so.vis.phLabel }}</span></span></sc-if>
<sc-if value="{{ so.vis.isText }}" hint-placeholder-val="{{ false }}"><div class="txt-src"><p class="mono-label">Deskripsimu</p><p>“{{ so.vis.text }}”</p></div></sc-if>
</div>
<p class="fine">{{ so.srcNote }}</p>
</div>
<div class="res-main">
<div class="col gap-8"><span class="tag tag-ai" style="align-self: flex-start">Perkiraan AI{{ so.r.exampleTag }}</span><h2 class="h1">{{ so.r.catLabel }}</h2><p class="muted">{{ so.r.sub }}</p></div>
<dl class="res-dl">
<div><dt>Kategori material</dt><dd>{{ so.r.cat }}</dd></div>
<div><dt>Perkiraan komposisi</dt><dd>{{ so.r.comp }} <span class="tag tag-est">Perkiraan</span></dd></div>
<div><dt>Kondisi yang terlihat</dt><dd><ul><sc-for list="{{ so.r.cond }}" as="c" hint-placeholder-count="3"><li>{{ c }}</li></sc-for></ul></dd></div>
<div><dt>Kategori pemanfaatan</dt><dd>{{ so.r.reuse }}</dd></div>
</dl>
<div class="conf">
<div class="conf-l"><span>Keyakinan</span><b>{{ so.r.confLabel }}</b></div>
<sc-if value="{{ so.r.showMeter }}" hint-placeholder-val="{{ true }}"><div class="meter" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ so.r.conf }}" aria-label="Tingkat keyakinan"><span class="{{ so.r.confCls }}" style="width: {{ so.r.conf }}%"></span></div></sc-if>
<p class="fine">{{ so.r.confNote }}</p>
</div>
<sc-if value="{{ so.r.hasWarnings }}" hint-placeholder-val="{{ false }}">
<div class="warn-box" role="note"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg><div><b>Perhatikan sebelum digunakan</b><ul><sc-for list="{{ so.r.warnings }}" as="w" hint-placeholder-count="2"><li>{{ w }}</li></sc-for></ul></div></div>
</sc-if>
<p class="fine">Batasan: analisis dari foto tidak dapat memastikan komposisi kimia, kontaminasi, kekuatan struktur, atau apakah barang diterima fasilitas daur ulang tertentu.</p>
<sc-if value="{{ so.isCorrecting }}" hint-placeholder-val="{{ false }}">
<div class="col gap-8"><h3 class="h4">Material yang benar:</h3><div class="chips"><sc-for list="{{ so.lowPicks }}" as="c" hint-placeholder-count="3"><button class="chip" onClick="{{ c.pick }}">{{ c.label }}</button></sc-for></div></div>
</sc-if>
<div class="row gap-8 wrapf">
<button class="btn btn-primary btn-lg" onClick="{{ so.next }}">Lihat langkah berikutnya<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
<button class="btn btn-ghost btn-lg" onClick="{{ so.correct }}">Bukan ini? Koreksi material</button>
</div>
</div>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{ so.isStep3 }}" hint-placeholder-val="{{ false }}">
<div>
<h2 class="h2">Apa langkah terbaik untuk {{ so.itemName }}?</h2>
<p class="muted mt-8" style="margin-bottom: 24px">Diurutkan dari kondisi yang terlihat dan tingkat ketidakpastian material. Pilih satu untuk melihat ide yang sesuai.</p>
<div class="act-grid" role="group" aria-label="Pilihan langkah">
<sc-for list="{{ so.actions }}" as="a" hint-placeholder-count="5">
<button class="{{ a.cls }}" onClick="{{ a.pick }}" aria-pressed="{{ a.on }}">
<span class="act-top"><span class="act-t">{{ a.title }}</span><sc-if value="{{ a.rec }}" hint-placeholder-val="{{ false }}"><span class="tag tag-rec">Disarankan</span></sc-if><sc-if value="{{ a.caution }}" hint-placeholder-val="{{ false }}"><span class="tag tag-warn">Perlu hati-hati</span></sc-if></span>
<span class="act-b">{{ a.body }}</span>
</button>
</sc-for>
</div>
<div class="so-nav"><button class="btn btn-secondary" onClick="{{ so.back }}">Kembali</button><button class="btn btn-primary" onClick="{{ so.next }}">Lihat ide pemanfaatan<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
</div>
</sc-if>

<sc-if value="{{ so.isStep4 }}" hint-placeholder-val="{{ false }}">
<div>
<h2 class="h2">Tiga ide untuk {{ so.itemName }}</h2>
<p class="muted mt-8" style="margin-bottom: 24px">Langkah yang kamu pilih: <b>{{ so.actionTitle }}</b>. Biaya adalah kisaran kasar untuk bahan tambahan, bukan harga pasti.</p>
<div class="ideas">
<sc-for list="{{ so.ideas }}" as="i" hint-placeholder-count="3">
<article class="idea">
<p class="idea-n">Ide {{ i.n }}</p>
<h3>{{ i.name }}</h3>
<p class="muted" style="font-size: 14.5px">{{ i.out }}</p>
<dl class="meta-grid">
<div><dt>Kesulitan</dt><dd><span class="diff" aria-hidden="true"><sc-for list="{{ i.dots }}" as="d" hint-placeholder-count="3"><i class="{{ d }}"></i></sc-for></span>{{ i.diff }}</dd></div>
<div><dt>Waktu</dt><dd>{{ i.time }}</dd></div>
<div><dt>Perkiraan biaya</dt><dd>{{ i.cost }}</dd></div>
<div><dt>Alat dan bahan</dt><dd>{{ i.tools }}</dd></div>
</dl>
<button class="btn btn-ghost btn-sm" style="align-self: flex-start; padding-left: 0" onClick="{{ i.toggle }}" aria-expanded="{{ i.isOpen }}">{{ i.toggleLabel }}</button>
<sc-if value="{{ i.isOpen }}" hint-placeholder-val="{{ false }}"><ol class="steps"><sc-for list="{{ i.steps }}" as="st" hint-placeholder-count="3"><li>{{ st }}</li></sc-for></ol></sc-if>
<div class="row gap-8 wrapf" style="margin-top: auto; padding-top: 8px; border-top: 1px solid #E2E2E2">
<button class="btn btn-secondary btn-sm" onClick="{{ i.openRel }}">Contoh: {{ i.relTitle }}</button>
<button class="btn btn-ghost btn-sm" onClick="{{ i.save }}"><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Simpan ide</button>
</div>
</article>
</sc-for>
</div>
<div class="so-nav"><button class="btn btn-secondary" onClick="{{ so.back }}">Kembali</button><button class="btn btn-primary" onClick="{{ so.next }}">Hubungkan ke marketplace<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
</div>
</sc-if>

<sc-if value="{{ so.isStep5 }}" hint-placeholder-val="{{ false }}">
<div>
<h2 class="h2">Terhubung ke marketplace</h2>
<p class="muted mt-8" style="margin-bottom: 24px">Lihat hasil karya serupa, temukan kreator yang menerima material ini, atau jual sendiri.</p>
<div class="cta-grid">
<button class="cta-tile" onClick="{{ so.seeSimilar }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><b>Lihat Produk Serupa</b><span>Produk jadi dari material yang sama</span></button>
<button class="cta-tile" onClick="{{ so.findCreators }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.5-5 6.5-5s5.5 1.5 6.5 5M16 4.5a3.5 3.5 0 0 1 0 7M18 15c2 .6 3.2 2.2 3.5 5"/></svg><b>Temukan Kreator</b><span>Yang menerima material serupa</span></button>
<button class="cta-tile" onClick="{{ so.sellMaterial }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9l1-5h14l1 5M4 9v11h16V9M4 9h16"/></svg><b>Jual Material</b><span>Buat listing dengan data analisis ini</span></button>
<button class="cta-tile" onClick="{{ so.saveResult }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg><b>Simpan Hasil Analisis</b><span>Tersimpan di profil, tanpa foto</span></button>
</div>
<div class="mk">
<div>
<h3 class="h3" style="margin-bottom: 16px">Produk dari material serupa</h3>
<div class="grid-3">
<sc-for list="{{ so.similar }}" as="p" hint-placeholder-count="3">
<article class="pc">
<div class="pc-media">
<button class="pc-open" onClick="{{ p.open }}" aria-label="Lihat detail {{ p.title }}"><sc-if value="{{ p.hasImg }}" hint-placeholder-val="{{ true }}"><img class="pc-img" src="{{ p.img }}" alt="{{ p.alt }}"></sc-if><sc-if value="{{ p.noImg }}" hint-placeholder-val="{{ false }}"><span class="{{ p.phCls }}"><span class="ph-tag">{{ p.phLabel }}</span></span></sc-if></button>
<button class="{{ p.favCls }}" onClick="{{ p.fav }}" aria-pressed="{{ p.isFav }}" aria-label="{{ p.favLabel }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
</div>
<div class="pc-body">
<span class="mat-tag"><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6M20 12a8 8 0 0 1-13.7 5.6"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>{{ p.matShort }}</span>
<h3 class="pc-title"><button class="linkbtn" onClick="{{ p.open }}">{{ p.title }}</button></h3>
<p class="pc-price">{{ p.priceTxt }}</p>
<p class="pc-seller"><span class="av">{{ p.initials }}</span><span class="t">{{ p.sellerName }} · {{ p.city }}</span></p>
</div>
</article>
</sc-for>
</div>
</div>
<div>
<h3 class="h3">Kreator yang menerima material ini</h3>
<p class="fine" style="margin: 4px 0 8px">Berdasarkan profil kreator. Hubungi dulu sebelum mengirim barang.</p>
<sc-for list="{{ so.creators }}" as="c" hint-placeholder-count="3">
<div class="creator"><span class="av av-m">{{ c.initials }}</span><div class="col" style="min-width: 0"><b style="font-size: 14.5px">{{ c.name }}</b><span class="fine">{{ c.city }} · menerima {{ c.accepts }}</span></div><button class="btn btn-secondary btn-sm" onClick="{{ c.chat }}">Hubungi</button></div>
</sc-for>
</div>
</div>
<div class="so-nav"><button class="btn btn-secondary" onClick="{{ so.back }}">Kembali</button><button class="btn btn-ghost" onClick="{{ so.restart }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>Sortir barang lain</button></div>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{ isSell }}" hint-placeholder-val="{{ false }}">
<div class="page wrap">
<nav class="crumbs" aria-label="Breadcrumb"><button onClick="{{ nav.dash }}">Dashboard Penjual</button><span aria-hidden="true">/</span><span aria-current="page">{{ sl.headTitle }}</span></nav>
<div class="row between center wrapf gap-16" style="margin-bottom: 28px">
<div class="col gap-8"><h1 class="h1">{{ sl.headTitle }}</h1><p class="muted">Isi bertahap. Semua saran AI bisa kamu ubah sebelum listing terbit.</p></div>
<div class="row gap-8 wrapf"><sc-if value="{{ sl.isEdit }}" hint-placeholder-val="{{ false }}"><button class="btn btn-ghost" onClick="{{ sl.cancelEdit }}">Batalkan edit</button></sc-if><button class="btn btn-secondary" onClick="{{ sl.saveDraft }}">Simpan draf</button></div>
</div>
<div class="sell">
<ol class="vsteps" aria-label="Langkah listing">
<sc-for list="{{ sl.steps }}" as="s" hint-placeholder-count="6"><li class="{{ s.cls }}"><button onClick="{{ s.go }}" aria-current="{{ s.cur }}"><span class="vs-n">{{ s.n }}</span><span class="vs-l">{{ s.label }}<span class="vs-s">{{ s.sub }}</span></span></button></li></sc-for>
</ol>
<div class="sell-form">

<sc-if value="{{ sl.s1 }}" hint-placeholder-val="{{ true }}">
<div class="col gap-16">
<div><h2 class="h2">Foto produk</h2><p class="muted mt-8">Maksimal 5 foto. Foto pertama jadi sampul. Sertakan foto material asal atau proses — pembeli lebih percaya bila bisa melihatnya.</p></div>
<div class="ph-grid">
<sc-for list="{{ sl.photos }}" as="ph" hint-placeholder-count="2"><div class="ph-slot"><img class="cover" src="{{ ph.url }}" alt="Foto produk {{ ph.n }}"><button class="iconbtn sm" onClick="{{ ph.remove }}" aria-label="Hapus foto {{ ph.n }}"><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><sc-if value="{{ ph.isCover }}" hint-placeholder-val="{{ false }}"><span class="tag tag-rec">Sampul</span></sc-if></div></sc-for>
<sc-if value="{{ sl.canAddPhoto }}" hint-placeholder-val="{{ true }}"><div><input id="slfile" class="sr" type="file" accept="image/jpeg,image/png,image/webp" multiple="{{ true }}" onChange="{{ sl.onFile }}"><label for="slfile" class="ph-add"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Tambah foto</label></div></sc-if>
</div>
<sc-if value="{{ sl.e.photos.on }}" hint-placeholder-val="{{ false }}"><p class="err" role="alert">{{ sl.e.photos.msg }}</p></sc-if>
<div><button class="btn btn-ghost btn-sm" onClick="{{ sl.addSample }}"><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-8 8"/></svg>Gunakan foto contoh (prototipe)</button></div>
</div>
</sc-if>

<sc-if value="{{ sl.s2 }}" hint-placeholder-val="{{ false }}">
<div class="col gap-24">
<div><h2 class="h2">Judul dan kategori</h2><p class="muted mt-8">Ceritakan dulu produkmu dengan bahasamu sendiri. AI bisa menyarankan judul dan kategori dari cerita itu.</p></div>
<div class="field">
<label class="lbl" for="sl-draft">Ceritakan produkmu</label>
<textarea id="sl-draft" class="{{ sl.cls.draft }}" value="{{ sl.v.draft }}" onChange="{{ sl.on.draft }}" placeholder="Contoh: tote dari saku jeans bekas pelanggan dan kanvas sisa konveksi, dijahit dua lapis, muat laptop 13 inci"></textarea>
<sc-if value="{{ sl.e.draft.on }}" hint-placeholder-val="{{ false }}"><p class="err" role="alert">{{ sl.e.draft.msg }}</p></sc-if>
<div class="row gap-8 wrapf"><button class="ai-btn" onClick="{{ sl.suggestTitles }}" disabled="{{ sl.titleLoading }}"><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>Sarankan judul, kategori, dan tag</button></div>
</div>
<sc-if value="{{ sl.titleLoading }}" hint-placeholder-val="{{ false }}"><div class="col gap-8" aria-busy="true"><div class="skel" style="width: 80%"></div><div class="skel" style="width: 65%"></div><div class="skel" style="width: 72%"></div></div></sc-if>
<sc-if value="{{ sl.hasTitleSugs }}" hint-placeholder-val="{{ false }}">
<div class="col gap-8"><p class="row gap-8 center"><span class="tag tag-ai">Saran AI</span><span class="fine">Pilih satu, lalu ubah sesukamu.</span></p>
<div class="sugg-list"><sc-for list="{{ sl.titleSugs }}" as="t" hint-placeholder-count="3"><button class="sugg-item" onClick="{{ t.pick }}"><span>{{ t.text }}</span><span class="use">Pakai</span></button></sc-for></div></div>
</sc-if>
<div class="field">
<div class="row between"><label class="lbl" for="sl-title">Judul produk</label><span class="fine">{{ sl.titleCount }}/70</span></div>
<input id="sl-title" class="{{ sl.cls.title }}" maxLength="70" value="{{ sl.v.title }}" onChange="{{ sl.on.title }}" placeholder="Jenis produk + material asal, misalnya “Tote Bag Denim Bekas”">
<sc-if value="{{ sl.e.title.on }}" hint-placeholder-val="{{ false }}"><p class="err" role="alert">{{ sl.e.title.msg }}</p></sc-if>
</div>
<div class="field">
<label class="lbl" for="sl-cat">Kategori</label>
<select id="sl-cat" class="{{ sl.cls.cat }}" value="{{ sl.v.cat }}" onChange="{{ sl.on.cat }}">
<option value="">Pilih kategori</option>
<option value="Tas dan Dompet">Tas dan Dompet</option>
<option value="Pakaian">Pakaian</option>
<option value="Aksesori">Aksesori</option>
<option value="Dekorasi Rumah">Dekorasi Rumah</option>
<option value="Furnitur">Furnitur</option>
<option value="Organizer dan Alat Tulis">Organizer dan Alat Tulis</option>
<option value="Bahan dan Material">Bahan dan Material</option>
</select>
<sc-if value="{{ sl.e.cat.on }}" hint-placeholder-val="{{ false }}"><p class="err" role="alert">{{ sl.e.cat.msg }}</p></sc-if>
<sc-if value="{{ sl.hasRecCat }}" hint-placeholder-val="{{ false }}"><div class="row gap-8 center wrapf"><span class="tag tag-ai">Saran AI</span><span class="fine">Kategori yang cocok: <b>{{ sl.recCat }}</b></span><button class="btn btn-ghost btn-sm" onClick="{{ sl.useRecCat }}">Pakai</button></div></sc-if>
</div>
</div>
</sc-if>

<sc-if value="{{ sl.s3 }}" hint-placeholder-val="{{ false }}">
<div class="col gap-24">
<div><h2 class="h2">Material, kondisi, dan detail</h2><p class="muted mt-8">Bagian ini yang membedakan listing upcycle: pisahkan bahan asal dari produk jadi.</p></div>
<div class="field">
<label class="lbl" for="sl-mat">Material asal</label>
<input id="sl-mat" class="{{ sl.cls.matOrigin }}" value="{{ sl.v.matOrigin }}" onChange="{{ sl.on.matOrigin }}" placeholder="Dari apa dan dari mana? Contoh: saku jeans bekas + kanvas sisa konveksi">
<sc-if value="{{ sl.e.matOrigin.on }}" hint-placeholder-val="{{ false }}"><p class="err" role="alert">{{ sl.e.matOrigin.msg }}</p></sc-if>
</div>
<div class="field">
<span class="lbl">Tag material</span>
<div class="chips">
<sc-for list="{{ sl.tags }}" as="t" hint-placeholder-count="2"><button class="chip chip-x" onClick="{{ t.remove }}" aria-label="Hapus tag {{ t.label }}">{{ t.label }}<svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></sc-for>
<sc-for list="{{ sl.tagSugs }}" as="t" hint-placeholder-count="2"><button class="chip" onClick="{{ t.add }}" aria-label="Tambah tag saran AI {{ t.label }}"><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>{{ t.label }}</button></sc-for>
</div>
<form class="row gap-8" onSubmit="{{ sl.addTag }}"><label for="sl-tag" class="sr">Tambah tag sendiri</label><input id="sl-tag" class="input" style="max-width: 280px" value="{{ sl.v.tagInput }}" onChange="{{ sl.on.tagInput }}" placeholder="Tambah tag sendiri"><button class="btn btn-secondary" type="submit">Tambah</button></form>
<span class="help">Tag dengan tanda + adalah saran AI dari ceritamu. Klik untuk menambahkan.</span>
</div>
<fieldset class="field">
<legend class="lbl">Kondisi</legend>
<div class="radio-cards">
<sc-for list="{{ sl.conds }}" as="c" hint-placeholder-count="4"><label class="{{ c.cls }}"><input type="radio" name="sl-cond" checked="{{ c.on }}" onChange="{{ c.pick }}"><span><span class="rc-t">{{ c.label }}</span><span class="rc-d">{{ c.desc }}</span></span></label></sc-for>
</div>
<sc-if value="{{ sl.e.cond.on }}" hint-placeholder-val="{{ false }}"><p class="err mt-8" role="alert">{{ sl.e.cond.msg }}</p></sc-if>
</fieldset>
<div class="form-grid">
<div class="field"><label class="lbl" for="sl-dim">Ukuran <span class="opt">(disarankan)</span></label><input id="sl-dim" class="input" value="{{ sl.v.dims }}" onChange="{{ sl.on.dims }}" placeholder="Contoh: 35 × 40 cm, tali 60 cm"></div>
<div class="field"><label class="lbl" for="sl-w">Berat kemasan (gram)</label><input id="sl-w" class="input" inputMode="numeric" value="{{ sl.v.weight }}" onChange="{{ sl.on.weight }}" placeholder="Contoh: 350"></div>
<div class="field span2"><label class="lbl" for="sl-proc">Proses pembuatan <span class="opt">(disarankan)</span></label><textarea id="sl-proc" class="input" value="{{ sl.v.process }}" onChange="{{ sl.on.process }}" placeholder="Apa yang kamu ubah? Dicuci, dipotong, dijahit ulang, diampelas…"></textarea></div>
</div>
<div class="field">
<div class="row between center wrapf gap-8"><label class="lbl" for="sl-desc">Deskripsi produk</label><button class="ai-btn" onClick="{{ sl.genDesc }}" disabled="{{ sl.descLoading }}"><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>{{ sl.descBtn }}</button></div>
<sc-if value="{{ sl.descLoading }}" hint-placeholder-val="{{ false }}"><div class="col gap-8" aria-busy="true"><div class="skel"></div><div class="skel" style="width: 85%"></div><div class="skel" style="width: 60%"></div></div></sc-if>
<textarea id="sl-desc" class="input" style="min-height: 150px" value="{{ sl.v.desc }}" onChange="{{ sl.on.desc }}" placeholder="Tulis sendiri, atau minta AI membuat draf dari data di atas."></textarea>
<span class="help">Draf AI dibuat dari isian di formulir ini. Tetap periksa dan sesuaikan sebelum terbit.</span>
</div>
<sc-if value="{{ sl.hasFlags }}" hint-placeholder-val="{{ false }}">
<div class="warn-box" role="status"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg><div><b>Klaim yang perlu dicek ulang</b><ul><sc-for list="{{ sl.flags }}" as="f" hint-placeholder-count="1"><li><b>{{ f.phrase }}</b> — {{ f.why }}</li></sc-for></ul></div></div>
</sc-if>
<div class="field">
<div class="row between center wrapf gap-8"><span class="lbl">Kata kunci pencarian</span><button class="ai-btn" onClick="{{ sl.genKeywords }}"><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>Sarankan kata kunci</button></div>
<sc-if value="{{ sl.hasKeywords }}" hint-placeholder-val="{{ false }}"><div class="chips"><sc-for list="{{ sl.keywords }}" as="k" hint-placeholder-count="4"><button class="chip chip-x" onClick="{{ k.remove }}" aria-label="Hapus kata kunci {{ k.label }}">{{ k.label }}<svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></sc-for></div></sc-if>
<span class="help">Kata yang mungkin diketik pembeli. Tidak ditampilkan di halaman produk.</span>
</div>
</div>
</sc-if>

<sc-if value="{{ sl.s4 }}" hint-placeholder-val="{{ false }}">
<div class="col gap-24">
<div><h2 class="h2">Harga dan stok</h2><p class="muted mt-8">Waktu dan keterampilanmu ikut dihitung. Referensi harga hanya muncul bila ada cukup listing pembanding.</p></div>
<div class="form-grid">
<div class="field"><label class="lbl" for="sl-price">Harga</label><div class="{{ sl.cls.price }}"><span>Rp</span><input id="sl-price" inputMode="numeric" value="{{ sl.v.price }}" onChange="{{ sl.on.price }}" placeholder="85000"></div><sc-if value="{{ sl.e.price.on }}" hint-placeholder-val="{{ false }}"><p class="err" role="alert">{{ sl.e.price.msg }}</p></sc-if></div>
<div class="field"><label class="lbl" for="sl-stock">Stok</label><input id="sl-stock" class="{{ sl.cls.stock }}" inputMode="numeric" value="{{ sl.v.stock }}" onChange="{{ sl.on.stock }}"><span class="help">Barang satu-satunya? Isi 1.</span><sc-if value="{{ sl.e.stock.on }}" hint-placeholder-val="{{ false }}"><p class="err" role="alert">{{ sl.e.stock.msg }}</p></sc-if></div>
</div>
<sc-if value="{{ sl.ref.has }}" hint-placeholder-val="{{ false }}">
<div class="ok-box"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><div><b>Referensi dari {{ sl.ref.n }} listing serupa di kategori {{ sl.ref.cat }}</b><p style="margin-top: 4px">Rentang {{ sl.ref.range }} · median {{ sl.ref.median }}. Data contoh, bukan harga wajib.</p></div></div>
</sc-if>
<sc-if value="{{ sl.ref.none }}" hint-placeholder-val="{{ true }}">
<div class="notice"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.5"/></svg><span>{{ sl.ref.noneText }}</span></div>
</sc-if>
<div class="col gap-12">
<h3 class="h4">Hitung dari biaya dan waktumu</h3>
<div class="calc">
<div class="field"><label class="lbl" for="c-mat">Biaya bahan (Rp)</label><input id="c-mat" class="input" inputMode="numeric" value="{{ sl.v.calcMat }}" onChange="{{ sl.on.calcMat }}" placeholder="25000"></div>
<div class="field"><label class="lbl" for="c-h">Jam kerja</label><input id="c-h" class="input" inputMode="decimal" value="{{ sl.v.calcHours }}" onChange="{{ sl.on.calcHours }}" placeholder="3"></div>
<div class="field"><label class="lbl" for="c-r">Tarif per jam (Rp)</label><input id="c-r" class="input" inputMode="numeric" value="{{ sl.v.calcRate }}" onChange="{{ sl.on.calcRate }}"></div>
<div class="calc-out"><span>{{ sl.calcTxt }}</span><sc-if value="{{ sl.calcHas }}" hint-placeholder-val="{{ false }}"><button class="btn btn-secondary btn-sm" onClick="{{ sl.useCalc }}">Pakai {{ sl.calcPrice }}</button></sc-if></div>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{ sl.s5 }}" hint-placeholder-val="{{ false }}">
<div class="col gap-24">
<div><h2 class="h2">Pengiriman dan lokasi</h2><p class="muted mt-8">Ongkir dihitung saat pembeli checkout. Di prototipe ini angkanya simulasi.</p></div>
<div class="form-grid">
<div class="field"><label class="lbl" for="sl-city">Dikirim dari</label>
<select id="sl-city" class="{{ sl.cls.city }}" value="{{ sl.v.city }}" onChange="{{ sl.on.city }}">
<option value="">Pilih kota</option><option value="Bandung">Bandung</option><option value="Bekasi">Bekasi</option><option value="Denpasar">Denpasar</option><option value="Depok">Depok</option><option value="Jakarta Selatan">Jakarta Selatan</option><option value="Jepara">Jepara</option><option value="Makassar">Makassar</option><option value="Malang">Malang</option><option value="Medan">Medan</option><option value="Semarang">Semarang</option><option value="Surabaya">Surabaya</option><option value="Yogyakarta">Yogyakarta</option>
</select>
<sc-if value="{{ sl.e.city.on }}" hint-placeholder-val="{{ false }}"><p class="err" role="alert">{{ sl.e.city.msg }}</p></sc-if></div>
<div class="field"><label class="lbl" for="sl-proct">Waktu pengemasan</label>
<select id="sl-proct" class="input" value="{{ sl.v.procTime }}" onChange="{{ sl.on.procTime }}"><option value="1–2 hari kerja">1–2 hari kerja</option><option value="3–5 hari kerja">3–5 hari kerja (dibuat setelah dipesan)</option><option value="1–2 minggu">1–2 minggu (pesanan khusus)</option></select></div>
</div>
<fieldset class="field">
<legend class="lbl">Opsi pengiriman</legend>
<div class="radio-cards">
<sc-for list="{{ sl.ships }}" as="c" hint-placeholder-count="4"><label class="{{ c.cls }}"><input type="checkbox" checked="{{ c.on }}" onChange="{{ c.pick }}"><span><span class="rc-t">{{ c.label }}</span><span class="rc-d">{{ c.desc }}</span></span></label></sc-for>
</div>
<sc-if value="{{ sl.e.ships.on }}" hint-placeholder-val="{{ false }}"><p class="err mt-8" role="alert">{{ sl.e.ships.msg }}</p></sc-if>
</fieldset>
</div>
</sc-if>

<sc-if value="{{ sl.s6 }}" hint-placeholder-val="{{ false }}">
<div class="col gap-24">
<div><h2 class="h2">Pratinjau dan terbitkan</h2><p class="muted mt-8">Begini listingmu akan terlihat oleh pembeli.</p></div>
<div class="preview-grid">
<article class="pc">
<div class="pc-media"><sc-if value="{{ sl.prev.hasImg }}" hint-placeholder-val="{{ true }}"><img class="pc-img" src="{{ sl.prev.img }}" alt="Pratinjau foto sampul"></sc-if><sc-if value="{{ sl.prev.noImg }}" hint-placeholder-val="{{ false }}"><span class="ph ph-textile"><span class="ph-tag">Belum ada foto</span></span></sc-if></div>
<div class="pc-body"><span class="mat-tag"><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6M20 12a8 8 0 0 1-13.7 5.6"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>{{ sl.prev.mat }}</span><h3 class="pc-title">{{ sl.prev.title }}</h3><p class="pc-price">{{ sl.prev.price }}</p><p class="pc-seller"><span class="av">{{ sl.prev.shopInit }}</span><span class="t">{{ sl.prev.shop }} · {{ sl.prev.city }}</span></p></div>
</article>
<div class="col gap-24">
<dl class="sum-dl">
<div><dt>Kategori</dt><dd>{{ sl.prev.cat }}</dd></div>
<div><dt>Material asal</dt><dd>{{ sl.prev.matOrigin }}</dd></div>
<div><dt>Kondisi</dt><dd>{{ sl.prev.cond }}</dd></div>
<div><dt>Stok</dt><dd>{{ sl.prev.stock }}</dd></div>
<div><dt>Pengiriman</dt><dd>{{ sl.prev.ship }}</dd></div>
