</div>
<div class="tabs" role="tablist" aria-label="Bagian panel admin">
<sc-for list="{{ ad.tabs }}" as="t" hint-placeholder-count="5"><button class="{{ t.cls }}" role="tab" aria-selected="{{ t.on }}" onClick="{{ t.pick }}">{{ t.label }}<sc-if value="{{ t.hasCount }}" hint-placeholder-val="{{ false }}"><span class="count">{{ t.count }}</span></sc-if></button></sc-for>
</div>
<sc-if value="{{ ad.isOverview }}" hint-placeholder-val="{{ true }}">
<div class="kpis">
<sc-for list="{{ ad.kpis }}" as="k" hint-placeholder-count="4"><button class="kpi" style="text-align: left" onClick="{{ k.go }}"><span class="kpi-l">{{ k.l }}</span><span class="kpi-v">{{ k.v }}</span><span class="kpi-d">{{ k.d }}</span></button></sc-for>
</div>
</sc-if>
<sc-if value="{{ ad.isSellers }}" hint-placeholder-val="{{ false }}">
<div>
<sc-for list="{{ ad.sellers }}" as="s" hint-placeholder-count="2">
<div class="arow"><span class="av av-m">{{ s.initials }}</span><div class="col gap-4"><b>{{ s.shop }}</b><span class="fine">{{ s.owner }} · {{ s.email }} · {{ s.city }}</span><sc-if value="{{ s.hasNote }}" hint-placeholder-val="{{ false }}"><span class="fine" style="color: #6B4600">{{ s.note }}</span></sc-if></div><div class="col gap-4 ac"><span class="fine">Rekening</span><span>{{ s.bankTxt }}</span></div><span><span class="{{ s.stCls }}">{{ s.stLabel }}</span></span>
<div class="row-actions"><sc-if value="{{ s.isPending }}" hint-placeholder-val="{{ true }}"><button class="btn btn-primary btn-sm" onClick="{{ s.approve }}">Setujui</button><button class="btn btn-secondary btn-sm" onClick="{{ s.reject }}">Tolak</button></sc-if></div></div>
</sc-for>
<sc-if value="{{ ad.sellersEmpty }}" hint-placeholder-val="{{ false }}"><div class="empty mt-24"><h2 class="h3">Tidak ada pengajuan toko</h2><p>Pengajuan toko baru akan muncul di sini.</p></div></sc-if>
</div>
</sc-if>
<sc-if value="{{ ad.isReports }}" hint-placeholder-val="{{ false }}">
<div>
<sc-for list="{{ ad.reports }}" as="r" hint-placeholder-count="2">
<div class="arow"><span class="av av-m">!</span><div class="col gap-4"><button class="linkbtn" style="font-weight: 700" onClick="{{ r.open }}">{{ r.title }}</button><span class="fine">{{ r.reason }} · {{ r.reporter }} · {{ r.date }}</span><span style="font-size: 14px">{{ r.detail }}</span></div><span class="ac"></span><span><span class="{{ r.stCls }}">{{ r.stLabel }}</span></span>
<div class="row-actions"><sc-if value="{{ r.isOpen }}" hint-placeholder-val="{{ true }}"><button class="btn btn-danger btn-sm" onClick="{{ r.takedown }}">Turunkan listing</button><button class="btn btn-ghost btn-sm" onClick="{{ r.dismiss }}">Abaikan</button></sc-if></div></div>
</sc-for>
<sc-if value="{{ ad.reportsEmpty }}" hint-placeholder-val="{{ false }}"><div class="empty mt-24"><h2 class="h3">Belum ada laporan</h2><p>Laporan listing dari pengguna akan muncul di sini.</p></div></sc-if>
</div>
</sc-if>
<sc-if value="{{ ad.isDisputes }}" hint-placeholder-val="{{ false }}">
<div>
<sc-for list="{{ ad.disputes }}" as="d" hint-placeholder-count="1">
<div class="arow"><span class="av av-m">?</span><div class="col gap-4"><b>{{ d.id }} · pesanan {{ d.order }}</b><span class="fine">{{ d.parties }} · {{ d.date }}</span><span style="font-size: 14px">{{ d.reason }} — {{ d.detail }}</span><sc-if value="{{ d.hasDecision }}" hint-placeholder-val="{{ false }}"><span class="fine"><b>Keputusan:</b> {{ d.decision }}</span></sc-if></div><span class="ac" style="font-weight: 700">{{ d.amountTxt }}</span><span><span class="{{ d.stCls }}">{{ d.stLabel }}</span></span>
<div class="row-actions"><sc-if value="{{ d.isOpen }}" hint-placeholder-val="{{ true }}"><button class="btn btn-primary btn-sm" onClick="{{ d.decide }}">Putuskan</button></sc-if></div></div>
</sc-for>
<sc-if value="{{ ad.disputesEmpty }}" hint-placeholder-val="{{ false }}"><div class="empty mt-24"><h2 class="h3">Tidak ada sengketa</h2><p>Pengajuan bantuan dari pembeli akan muncul di sini.</p></div></sc-if>
</div>
</sc-if>
<sc-if value="{{ ad.isUsers }}" hint-placeholder-val="{{ false }}">
<div>
<form class="ex-search" role="search" onSubmit="{{ ad.noSubmit }}" style="margin-bottom: 12px"><div class="field-inline"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><label for="ad-q" class="sr">Cari pengguna</label><input id="ad-q" type="search" value="{{ ad.q }}" onChange="{{ ad.onQ }}" placeholder="Cari nama atau email"></div></form>
<sc-for list="{{ ad.users }}" as="u" hint-placeholder-count="3">
<div class="arow"><span class="av av-m">{{ u.initials }}</span><div class="col gap-4"><b>{{ u.name }}</b><span class="fine">{{ u.email }}</span></div><span class="ac">{{ u.role }}</span><span><span class="{{ u.stCls }}">{{ u.stLabel }}</span></span>
<div class="row-actions"><sc-if value="{{ u.canToggle }}" hint-placeholder-val="{{ true }}"><button class="btn btn-secondary btn-sm" onClick="{{ u.toggle }}">{{ u.toggleLabel }}</button></sc-if></div></div>
</sc-for>
<sc-if value="{{ ad.usersEmpty }}" hint-placeholder-val="{{ false }}"><div class="empty mt-24"><h2 class="h3">Pengguna tidak ditemukan</h2><p>Coba kata kunci lain.</p></div></sc-if>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{ ch.showShell }}" hint-placeholder-val="{{ false }}">
<section class="{{ ch.shellCls }}" aria-label="Rupa Assistant" role="{{ ch.role }}">
<aside class="as-side">
<div class="col gap-8"><p class="eyebrow">AI Assistant</p><h1 class="h2">Tanya apa saja soal belanja dan upcycle</h1></div>
<button class="btn btn-primary w100" onClick="{{ ch.newConv }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Percakapan baru</button>
<div class="col gap-8"><h2 class="mono-label">Riwayat</h2>
<ul class="conv-list"><sc-for list="{{ ch.convs }}" as="c" hint-placeholder-count="3"><li><button class="{{ c.cls }}" aria-current="{{ c.cur }}" onClick="{{ c.open }}"><span class="cv-t">{{ c.title }}</span><span class="cv-s">{{ c.sub }}</span></button></li></sc-for></ul></div>
<div class="as-note"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.5"/></svg><span>Teks bertanda <b>Saran AI</b> bisa keliru. Harga, stok, dan penjual di kartu bertanda <b>Data katalog</b> diambil langsung dari listing (data contoh).</span></div>
</aside>
<div class="as-main">
<div class="as-top">
<div class="row gap-8 center"><span class="ai-dot" aria-hidden="true"></span><b>Rupa Assistant</b></div>
<div class="row gap-8 center wrapf">
<div class="seg" role="group" aria-label="Mode asisten"><button class="{{ ch.shopCls }}" aria-pressed="{{ ch.shopMode }}" onClick="{{ ch.setShop }}">Belanja dengan AI</button><button class="{{ ch.upCls }}" aria-pressed="{{ ch.upMode }}" onClick="{{ ch.setUp }}">Konsultasi Upcycle</button></div>
<sc-if value="{{ ch.isDrawer }}" hint-placeholder-val="{{ false }}"><button class="iconbtn sm" onClick="{{ ch.openFull }}" aria-label="Buka layar penuh"><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button><button class="iconbtn sm" onClick="{{ ch.close }}" aria-label="Tutup asisten"><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></sc-if>
</div>
</div>
<div class="as-msgs" ref="{{ ch.msgRef }}" aria-live="polite">
<sc-if value="{{ ch.isEmpty }}" hint-placeholder-val="{{ true }}">
<div class="welcome">
<h2>{{ ch.welcomeTitle }}</h2>
<p class="muted">{{ ch.welcomeText }}</p>
<div class="sugg"><sc-for list="{{ ch.suggestions }}" as="s" hint-placeholder-count="4"><button onClick="{{ s.send }}"><span>{{ s.label }}</span><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></sc-for></div>
</div>
</sc-if>
<sc-for list="{{ ch.messages }}" as="m" hint-placeholder-count="2">
<div class="{{ m.cls }}">
<sc-if value="{{ m.isUser }}" hint-placeholder-val="{{ false }}"><p>{{ m.text }}</p></sc-if>
<sc-if value="{{ m.isAi }}" hint-placeholder-val="{{ true }}">
<div class="col gap-10" style="gap: 10px">
<div class="ai-meta"><span class="ai-dot" aria-hidden="true"></span>Saran AI</div>
<sc-for list="{{ m.paras }}" as="t" hint-placeholder-count="1"><p>{{ t }}</p></sc-for>
<sc-if value="{{ m.isProducts }}" hint-placeholder-val="{{ false }}">
<div class="rec-list">
<sc-for list="{{ m.products }}" as="p" hint-placeholder-count="3">
<article class="rec">
<button class="rec-img" onClick="{{ p.open }}" aria-label="Lihat {{ p.title }}"><sc-if value="{{ p.hasImg }}" hint-placeholder-val="{{ true }}"><img class="cover" src="{{ p.img }}" alt="{{ p.alt }}"></sc-if><sc-if value="{{ p.noImg }}" hint-placeholder-val="{{ false }}"><span class="{{ p.phCls }}"></span></sc-if></button>
<div class="rec-b">
<span class="tag tag-data" style="align-self: flex-start">Data katalog</span>
<button class="linkbtn" style="font-weight: 600" onClick="{{ p.open }}">{{ p.title }}</button>
<span><b>{{ p.priceTxt }}</b> <span class="fine">· {{ p.sellerName }}, {{ p.city }} · ★ {{ p.rating }}</span></span>
<ul class="why" aria-label="Kenapa cocok"><sc-for list="{{ p.reasons }}" as="r" hint-placeholder-count="2"><li>{{ r }}</li></sc-for></ul>
<div class="rec-actions"><button class="btn btn-secondary btn-sm" onClick="{{ p.open }}">Lihat Produk</button><button class="btn btn-ghost btn-sm" onClick="{{ p.cmp }}" aria-pressed="{{ p.inCmp }}">{{ p.cmpLabel }}</button><button class="btn btn-ghost btn-sm" onClick="{{ p.fav }}" aria-pressed="{{ p.isFav }}">{{ p.saveLabel }}</button></div>
</div>
</article>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ m.isCompare }}" hint-placeholder-val="{{ false }}">
<div class="cmp">
<sc-for list="{{ m.cols }}" as="c" hint-placeholder-count="3">
<div class="cmp-col">
<span class="tag tag-data" style="align-self: flex-start">Data katalog</span>
<button class="linkbtn" style="font-weight: 700" onClick="{{ c.open }}">{{ c.title }}</button>
<dl><sc-for list="{{ c.rows }}" as="r" hint-placeholder-count="6"><div><dt>{{ r.k }}</dt><dd>{{ r.v }}</dd></div></sc-for></dl>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ m.isGuide }}" hint-placeholder-val="{{ false }}">
<div class="guide">
<h3>{{ m.title }}</h3>
<sc-for list="{{ m.ideas }}" as="g" hint-placeholder-count="3"><div class="g-idea"><b>{{ g.name }}</b><span class="fine">{{ g.meta }}</span><ol><sc-for list="{{ g.steps }}" as="s" hint-placeholder-count="3"><li>{{ s }}</li></sc-for></ol></div></sc-for>
<sc-if value="{{ m.hasSafety }}" hint-placeholder-val="{{ false }}"><div class="warn-box"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg><span><b>Keamanan:</b> {{ m.safety }}</span></div></sc-if>
</div>
</sc-if>
<sc-if value="{{ m.isError }}" hint-placeholder-val="{{ false }}">
<div class="err-box" role="alert"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg><span class="grow">{{ m.errText }}</span><button class="btn btn-secondary btn-sm" onClick="{{ m.retry }}"><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>Coba lagi</button></div>
</sc-if>
<sc-if value="{{ m.hasChips }}" hint-placeholder-val="{{ false }}"><div class="chips"><sc-for list="{{ m.chips }}" as="c" hint-placeholder-count="3"><button class="chip" onClick="{{ c.send }}">{{ c.label }}</button></sc-for></div></sc-if>
</div>
</sc-if>
</div>
</sc-for>
<sc-if value="{{ ch.typing }}" hint-placeholder-val="{{ false }}"><div class="typing" role="status" aria-label="Asisten sedang menulis"><span></span><span></span><span></span></div></sc-if>
</div>
<sc-if value="{{ ch.hasCompare }}" hint-placeholder-val="{{ false }}"><div class="cmp-tray"><span class="grow">{{ ch.compareCount }} produk dipilih untuk dibandingkan</span><button class="btn btn-primary btn-sm" onClick="{{ ch.compareNow }}" disabled="{{ ch.cmpDis }}">Bandingkan</button><button class="btn btn-ghost btn-sm" onClick="{{ ch.clearCompare }}">Kosongkan</button></div></sc-if>
<form class="as-input" onSubmit="{{ ch.onSubmit }}">
<label for="{{ ch.inputId }}" class="sr">Tulis pesan untuk asisten</label>
<input id="{{ ch.inputId }}" class="input" value="{{ ch.input }}" onChange="{{ ch.onInput }}" placeholder="{{ ch.placeholder }}">
<button class="btn btn-primary" type="submit" disabled="{{ ch.cantSend }}" aria-label="Kirim pesan"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-3-6z"/></svg></button>
</form>
<p class="fine as-fine">Saran AI bisa keliru — cek detail produk sebelum membeli.</p>
</div>
</section>
</sc-if>
</main>

<footer class="ftr">
<div class="wrap">
<div class="ftr-grid">
<div class="col gap-12"><span class="row gap-8 center"><img class="brand-mark" src="assets/brand/rupa-mark.png" alt="" width="31" height="40"><span class="wm">Rupa.</span></span><p style="max-width: 34ch; font-size: 14px">Marketplace antarpengguna untuk karya upcycle dari Indonesia. Barang lama, cerita baru.</p><p class="fine" style="color: #A6A6A6">Kontak: [email dukungan] · [nomor WhatsApp layanan]</p></div>
<div><h2>Bantuan</h2><ul><li><button onClick="{{ foot.help }}">Pusat bantuan</button></li><li><button onClick="{{ foot.howBuy }}">Cara berbelanja</button></li><li><button onClick="{{ foot.cancel }}">Pembatalan dan pengembalian</button></li><li><button onClick="{{ nav.orders }}">Lacak pesanan</button></li></ul></div>
<div><h2>Marketplace</h2><ul><li><button onClick="{{ foot.policy }}">Kebijakan marketplace</button></li><li><button onClick="{{ foot.sellerGuide }}">Panduan penjual</button></li><li><button onClick="{{ foot.claims }}">Aturan klaim material</button></li><li><button onClick="{{ foot.banned }}">Barang yang dilarang</button></li></ul></div>
<div><h2>Ikuti kami</h2><ul><li><button onClick="{{ foot.social }}">Instagram</button></li><li><button onClick="{{ foot.social }}">TikTok</button></li><li><button onClick="{{ foot.social }}">YouTube</button></li><li><button onClick="{{ foot.contact }}">Hubungi kami</button></li></ul></div>
</div>
<div class="ftr-bottom"><span>© 2026 Rupa · Prototipe desain</span><span>Semua produk, penjual, harga, dan ulasan adalah data contoh.</span></div>
</div>
</footer>

<sc-if value="{{ showBnav }}" hint-placeholder-val="{{ true }}">
<nav class="bnav" aria-label="Navigasi bawah">
<button class="{{ bnCls.home }}" aria-current="{{ navCur.home }}" onClick="{{ nav.home }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Beranda</button>
<button class="{{ bnCls.explore }}" aria-current="{{ navCur.explore }}" onClick="{{ nav.explore }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Jelajahi</button>
<button class="{{ bnCls.sortir }}" aria-current="{{ navCur.sortir }}" onClick="{{ nav.sortir }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><path d="M8 12h8"/></svg>Sortir AI</button>
<button class="{{ bnCls.sell }}" aria-current="{{ navCur.sell }}" onClick="{{ nav.sell }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9l1-5h14l1 5M4 9v11h16V9M4 9h16"/></svg>Jual</button>
<button class="{{ bnCls.profile }}" aria-current="{{ navCur.profile }}" onClick="{{ nav.account }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Akun</button>
</nav>
</sc-if>

<sc-if value="{{ ch.showLauncher }}" hint-placeholder-val="{{ true }}">
<button class="launcher" onClick="{{ ch.open }}" aria-label="Buka Rupa Assistant"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8M8 13h5"/></svg><span class="hide-m">Tanya AI</span></button>
</sc-if>

<sc-if value="{{ hasModal }}" hint-placeholder-val="{{ false }}">
<div class="ov" onClick="{{ md.close }}"></div>
<div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title" onKeyDown="{{ md.onKey }}" ref="{{ md.ref }}">
<div class="modal-h"><div class="col gap-4"><h2 id="m-title" class="h3">{{ md.title }}</h2><sc-if value="{{ md.hasSub }}" hint-placeholder-val="{{ false }}"><p class="fine">{{ md.sub }}</p></sc-if></div><button class="iconbtn sm modal-x" onClick="{{ md.close }}" aria-label="Tutup"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>

<sc-if value="{{ md.isConfirm }}" hint-placeholder-val="{{ true }}">
<div class="col gap-16"><p class="muted">{{ md.body }}</p><div class="modal-f"><button class="btn btn-secondary" onClick="{{ md.close }}">Batal</button><button class="{{ md.confirmCls }}" onClick="{{ md.confirm }}">{{ md.confirmLabel }}</button></div></div>
</sc-if>

<sc-if value="{{ md.isChat }}" hint-placeholder-val="{{ false }}">
<div class="col gap-12">
<div class="thread" ref="{{ md.threadRef }}"><sc-for list="{{ md.thread }}" as="t" hint-placeholder-count="2"><div class="{{ t.cls }}">{{ t.text }}<small>{{ t.time }}</small></div></sc-for></div>
<form class="row gap-8" onSubmit="{{ md.submit }}"><label for="m-chat" class="sr">Tulis pesan</label><input id="m-chat" class="input" value="{{ md.text }}" onChange="{{ md.onText }}" placeholder="Tanya soal ukuran, bahan, atau pengiriman"><button class="btn btn-primary" type="submit">Kirim</button></form>
<p class="fine">Demi keamanan, jangan bagikan nomor rekening atau bertransaksi di luar Rupa. Balasan penjual di prototipe ini otomatis.</p>
</div>
</sc-if>

<sc-if value="{{ md.isRadio }}" hint-placeholder-val="{{ false }}">
<form class="col gap-12" onSubmit="{{ md.submit }}">
<fieldset><legend class="lbl">{{ md.radioLegend }}</legend>
<div class="col gap-4"><sc-for list="{{ md.reasons }}" as="r" hint-placeholder-count="4"><label class="check"><input type="radio" name="m-reason" checked="{{ r.on }}" onChange="{{ r.pick }}">{{ r.label }}</label></sc-for></div>
</fieldset>
<div class="field"><label class="lbl" for="m-detail">Ceritakan detailnya <span class="opt">(opsional)</span></label><textarea id="m-detail" class="input" value="{{ md.text }}" onChange="{{ md.onText }}"></textarea></div>
<sc-if value="{{ md.hasErr }}" hint-placeholder-val="{{ false }}"><p class="err" role="alert">{{ md.err }}</p></sc-if>
<p class="fine">{{ md.note }}</p>
<div class="modal-f"><button class="btn btn-secondary" type="button" onClick="{{ md.close }}">Batal</button><button class="btn btn-primary" type="submit">{{ md.submitLabel }}</button></div>
</form>
</sc-if>

<sc-if value="{{ md.isResi }}" hint-placeholder-val="{{ false }}">
<form class="col gap-12" onSubmit="{{ md.submit }}">
<div class="field"><label class="lbl" for="m-cour">Kurir</label><select id="m-cour" class="input" value="{{ md.text2 }}" onChange="{{ md.onText2 }}"><option value="Reguler">Kurir reguler</option><option value="Ekspres">Kurir ekspres</option><option value="Kargo">Kargo</option></select></div>
<div class="field"><label class="lbl" for="m-resi">Nomor resi</label><input id="m-resi" class="input" value="{{ md.text }}" onChange="{{ md.onText }}" placeholder="Minimal 8 karakter huruf atau angka"><sc-if value="{{ md.hasErr }}" hint-placeholder-val="{{ false }}"><p class="err" role="alert">{{ md.err }}</p></sc-if></div>
<div class="modal-f"><button class="btn btn-secondary" type="button" onClick="{{ md.close }}">Batal</button><button class="btn btn-primary" type="submit">Tandai dikirim</button></div>
</form>
</sc-if>

<sc-if value="{{ md.isReview }}" hint-placeholder-val="{{ false }}">
<form class="col gap-12" onSubmit="{{ md.submit }}">
<fieldset><legend class="lbl">Rating</legend><div class="stars"><sc-for list="{{ md.stars }}" as="s" hint-placeholder-count="5"><button type="button" class="{{ s.cls }}" onClick="{{ s.pick }}" aria-pressed="{{ s.on }}" aria-label="{{ s.label }}"><svg class="ic ic-fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></button></sc-for></div></fieldset>
<div class="field"><label class="lbl" for="m-rev">Ulasanmu</label><textarea id="m-rev" class="input" value="{{ md.text }}" onChange="{{ md.onText }}" placeholder="Bagaimana kualitas jahitan, kesesuaian deskripsi material, dan pengemasannya?"></textarea></div>
<sc-if value="{{ md.hasErr }}" hint-placeholder-val="{{ false }}"><p class="err" role="alert">{{ md.err }}</p></sc-if>
<div class="modal-f"><button class="btn btn-secondary" type="button" onClick="{{ md.close }}">Batal</button><button class="btn btn-primary" type="submit">Kirim ulasan</button></div>
</form>
</sc-if>

<sc-if value="{{ md.isText }}" hint-placeholder-val="{{ false }}">
<form class="col gap-12" onSubmit="{{ md.submit }}">
<sc-if value="{{ md.hasQuote }}" hint-placeholder-val="{{ false }}"><div class="notice"><span>“{{ md.quote }}”</span></div></sc-if>
<sc-if value="{{ md.hasField2 }}" hint-placeholder-val="{{ false }}"><div class="field"><label class="lbl" for="m-t2">{{ md.label2 }}</label><input id="m-t2" class="input" value="{{ md.text2 }}" onChange="{{ md.onText2 }}"></div></sc-if>
<div class="field"><label class="lbl" for="m-t1">{{ md.label1 }}</label><textarea id="m-t1" class="input" value="{{ md.text }}" onChange="{{ md.onText }}"></textarea></div>
<sc-if value="{{ md.hasErr }}" hint-placeholder-val="{{ false }}"><p class="err" role="alert">{{ md.err }}</p></sc-if>
<div class="modal-f"><button class="btn btn-secondary" type="button" onClick="{{ md.close }}">Batal</button><button class="btn btn-primary" type="submit">{{ md.submitLabel }}</button></div>
</form>
</sc-if>

      lg: lgInit(), rg: rgInit(), fp: fpInit(), sh: shInit(), payments: [], payId: null, success: { title: 'Pesanan dibuat', text: '' },

    };

  componentDidUpdate(prevProps, prevState) {

    if (page === 'payment' && !(extra && extra.payId) && !this.state.payments.some((p) => p.id === this.state.payId && p.status === 'pending')) { const o = this.state.orders.find((x) => x.status === 'menunggu' && (x.buyer || 'dinda') === u.id); if (o) { this.openPayFor(o.id); return; } }
    if (page === 'admin' && u.role !== 'admin') { this.toastMsg('Halaman ini khusus admin', { kind: 'warn' }); return; }

    if ((page === 'sell' || page === 'dash') && !u.shop) { page = 'openShop'; extra = Object.assign({}, extra || {}, { sh: shInit() }); this.toastMsg('Buka toko dulu untuk mulai berjualan — hanya tiga langkah', { kind: 'info' }); }

  openProduct(id) { this.go('product', { pid: id, gi: 0, qty: 1 }); }
  explore(patch) { this.go('explore', { ex: Object.assign({ q: '', cat: '', mats: [], price: '', conds: [], city: '', r47: false, avail: false, sort: 'rel', open: false, seller: '' }, patch || {}) }); }

  /* wishlist + cart */
  toggleWish(id) {
    if (!this.user()) { this.requireLogin(this.state.page, null, 'Masuk untuk menyimpan produk ke wishlist.'); return; }
    const on = this.state.wish.indexOf(id) >= 0;

  }
  addToCart(id, qty, silent) {

    this.setState((s) => ({ cart: ex ? s.cart.map((c) => (c.id === id ? { id, qty: want } : c)) : s.cart.concat([{ id, qty }]) }));

  setQty(id, q) {

  card(p) {

      id: p.id, title: p.title, priceTxt: rp(p.price), img: p.img, hasImg: !!p.img, noImg: !p.img,

  filterProducts(ex) {
    let list = PRODUCTS.filter((p) => this.state.hidden.indexOf(p.id) < 0);
    const q = (ex.q || '').trim().toLowerCase();
    if (q) {
      const toks = q.split(/\s+/).filter(Boolean);
      list = list.map((p) => {
        const hay = (p.title + ' ' + p.kw + ' ' + p.matShort + ' ' + CATL[p.cat] + ' ' + SELLERS[p.seller].name + ' ' + p.uses.join(' ')).toLowerCase();
        return { p, sc: toks.filter((t) => hay.indexOf(t) >= 0).length };
      }).filter((x) => x.sc > 0).sort((a, b) => b.sc - a.sc).map((x) => x.p);
    }
    if (ex.cat) list = list.filter((p) => p.cat === ex.cat);
    if (ex.mats.length) list = list.filter((p) => p.mats.some((m) => ex.mats.indexOf(m) >= 0));
    if (ex.price === 'lt100') list = list.filter((p) => p.price < 100000);
    if (ex.price === '100-200') list = list.filter((p) => p.price >= 100000 && p.price <= 200000);
    if (ex.price === 'gt200') list = list.filter((p) => p.price > 200000);
    if (ex.conds.length) list = list.filter((p) => ex.conds.indexOf(p.cond) >= 0);
    if (ex.city) list = list.filter((p) => SELLERS[p.seller].city === ex.city);
    if (ex.r47) list = list.filter((p) => SELLERS[p.seller].rating >= 4.7);
    if (ex.avail) list = list.filter((p) => p.stock > 0);
    if (ex.seller) list = list.filter((p) => p.seller === ex.seller);
    const sorters = { new: (a, b) => b.date - a.date, asc: (a, b) => a.price - b.price, desc: (a, b) => b.price - a.price, pop: (a, b) => b.sold - a.sold };
    if (sorters[ex.sort]) list = list.slice().sort(sorters[ex.sort]);
    return list;
  }

  /* ---------- AI Sortir ---------- */
  updSo(patch) { this.upd('so', patch); }
  handleFile(f) {
    if (!f) return;
    if (['image/jpeg', 'image/png', 'image/webp'].indexOf(f.type) < 0) { this.updSo({ fileErr: 'Format belum didukung. Gunakan JPG, PNG, atau WebP.' }); return; }
    if (f.size > 10 * 1024 * 1024) { this.updSo({ fileErr: 'Ukuran foto lebih dari 10 MB. Coba kompres atau foto ulang.' }); return; }
    let url = '';
    try { url = URL.createObjectURL(f); } catch (e) { url = ''; }
    this.updSo({ src: { kind: 'upload', url, name: f.name }, status: 'preview', fileErr: '', drag: false, step: 1 });
  }
  analyze(src) {
    const s = src || this.state.so.src;
    this.updSo({ src: s, status: 'loading', loadIdx: 0 });
    this.later(() => this.updSo({ loadIdx: 1 }), 850);
    this.later(() => this.updSo({ loadIdx: 2 }), 1700);
    this.later(() => this.finishAnalyze(s), 2500);
  }
  finishAnalyze(src) {
    if (this.state.so.status !== 'loading') return;
    if (src.kind === 'upload') { this.updSo({ status: 'uploadChoice' }); return; }
    if (src.kind === 'manual') {
      const t = src.text.toLowerCase();
      const k = /jeans|denim|jins/.test(t) ? 'jeans' : /botol|plastik|galon|wadah plastik/.test(t) ? 'bottle' : /kursi|meja|kayu|lemari|palet|rak/.test(t) ? 'chair' : null;
      this.toResult(k, !k);
      return;
    }
    if (src.key === 'screen') { this.updSo({ status: 'unsupported' }); return; }
    if (src.key === 'error') { this.updSo({ status: 'error' }); return; }
    if (src.key === 'blurry') { this.toResult(null, true); return; }
    this.toResult(src.key, false);
  }
  toResult(k, low) {
    this.updSo((so) => ({ status: 'done', scen: k, low, picked: false, step: 2, maxStep: Math.max(so.maxStep, 2), action: k ? SCEN[k].rec : null, correcting: false, openIdea: 0 }));
    this.toTop();
  }
  pickScen(k) {
    this.updSo((so) => ({ status: 'done', scen: k, low: false, picked: true, step: 2, maxStep: Math.max(so.maxStep, 2), action: SCEN[k].rec, correcting: false, openIdea: 0 }));
  }
  resetSo() { this.setState({ so: soInit() }); }
  toManual() {
    this.setState({ so: Object.assign(soInit(), { manual: this.state.so.manual }) });
    this.later(() => { const el = document.getElementById('somanual'); if (el) el.focus(); }, 80);
  }
  soNext() {
    const so = this.state.so;
    if (so.step === 2 && !so.scen) { this.toastMsg('Pilih material dulu supaya sarannya tepat', { kind: 'warn' }); return; }
    if (so.step === 3 && !so.action) { this.toastMsg('Pilih salah satu langkah dulu', { kind: 'warn' }); return; }
    const n = Math.min(5, so.step + 1);
    this.updSo({ step: n, maxStep: Math.max(so.maxStep, n) });
    this.toTop();
  }
  saveAnalysis(title) {
    if (!this.user()) { this.toastMsg('Masuk dulu untuk menyimpan hasil analisis', { kind: 'info', actionLabel: 'Masuk', action: () => this.requireLogin('sortir', null, 'Masuk untuk menyimpan hasil AI Sortir. Hasil analisismu tetap ada.') }); return; }
    const so = this.state.so;
    const S = SCEN[so.scen];
    const t = title || ((so.src && so.src.kind === 'sample' ? SAMPLES[so.src.key].label : 'Barang dari fotomu') + ' — ' + S.catLabel);
    this.upd('pf', (pf) => ({ saved: [{ id: 's' + Date.now(), title: t, date: 'Disimpan hari ini', scen: so.scen }].concat(pf.saved) }));
    this.toastMsg('Tersimpan di profil (tanpa foto)', { actionLabel: 'Lihat', action: () => { this.upd('pf', { tab: 'saved' }); this.go('profile'); } });
  }

  /* ---------- Chat ---------- */
  updChat(patch) { this.upd('chat', patch); }
  sendChat(text) {
    text = (text || '').trim();
    const c0 = this.state.chat;
    if (!text || c0.typing) return;
    this.setState((s) => {
      const c = Object.assign({}, s.chat);
      const convs = Object.assign({}, c.convs);
      let cur = c.cur;
      if (cur === 'new') {
        const id = 'c' + c.seq;
        convs[id] = { title: text.length > 36 ? text.slice(0, 34) + '…' : text, sub: c.mode === 'shop' ? 'Belanja dengan AI' : 'Konsultasi upcycle', mode: c.mode, msgs: [] };
        convs.new = { title: 'Percakapan baru', sub: '', mode: c.mode, msgs: [] };
        cur = id; c.order = [id].concat(c.order); c.seq = c.seq + 1;
      }
      convs[cur] = Object.assign({}, convs[cur], { msgs: convs[cur].msgs.concat([{ role: 'user', text }]) });
      return { chat: Object.assign(c, { convs, cur, input: '', typing: true }) };
    });
    this.later(() => this.replyTo(text), 900 + Math.min(700, text.length * 10));
  }
  replyTo(text) {
    const res = this.respond(text, this.state.chat);
    this.setState((s) => {
      const c = s.chat;
      const conv = c.convs[c.cur];
      const convs = Object.assign({}, c.convs, { [c.cur]: Object.assign({}, conv, { msgs: conv.msgs.concat([res.msg]) }) });
      return { chat: Object.assign({}, c, { convs, typing: false, ctx: res.ctx || c.ctx }) };
    });
  }
  retryChat(idx) {
    const c = this.state.chat;
    const conv = c.convs[c.cur];
    const text = conv.msgs[idx].retryText;
    this.setState((s) => {
      const cc = s.chat;
      const cv = cc.convs[cc.cur];
      return { chat: Object.assign({}, cc, { typing: true, convs: Object.assign({}, cc.convs, { [cc.cur]: Object.assign({}, cv, { sub: cv.mode === 'shop' ? 'Belanja dengan AI' : 'Konsultasi upcycle', msgs: cv.msgs.filter((m, i) => i !== idx) }) }) }) };
    });
    this.later(() => this.replyTo(text), 1000);
  }
  respond(text, chat) {
    const t = text.toLowerCase();
    if (/bandingkan|perbandingan/.test(t)) return this.compareResp(chat);
    const shopWords = /(cari|beli|rekomendasi|di ?bawah|ada produk|carikan|budget|hadiah|kado|yang lebih murah|pilihan lain)/;
    const consultWords = /(bisa dibuat|bisa jadi apa|cara |bagaimana|gimana|\bide\b|material apa|cocok untuk membuat|menentukan harga|harga jual|deskripsi|memanfaatkan|bikin|membuat)/;
    if ((consultWords.test(t) && !shopWords.test(t)) || (chat.mode === 'upcycle' && !shopWords.test(t))) return { msg: this.consult(t) };
    return this.shop(t, chat);
  }
  consult(t) {
    if (/harga/.test(t)) return KB.harga();
    if (/deskripsi|judul listing|foto produk/.test(t)) return KB.deskripsi();
    if (/pensil|alat tulis/.test(t)) return KB.pensil();
    if (/jeans|denim|jins/.test(t)) return KB.jeans();
    if (/botol|plastik/.test(t)) return KB.botol();
    if (/kayu|kursi|meja|palet/.test(t)) return KB.kayu();
    if (/kaleng/.test(t)) return KB.kaleng();
    return KB.fallback();
  }
  compareResp(chat) {
    const ids = chat.compare.length >= 2 ? chat.compare.slice() : (chat.ctx.lastIds || []).slice(0, 3);
    if (ids.length < 2) return { msg: { role: 'ai', kind: 'clarify', paras: ['Pilih minimal dua produk dulu — tekan “Bandingkan” di kartu produk, atau minta aku mencarikan produknya.'], chips: ['Cari tas upcycle di bawah Rp150.000'] } };
    const ps = ids.map(P);
    const cheap = ps.slice().sort((a, b) => a.price - b.price)[0];
    const best = ps.slice().sort((a, b) => b.rating - a.rating)[0];
    return { msg: { role: 'ai', kind: 'compare', ids, paras: ['Perbandingan ' + ps.length + ' produk dari data listing. Termurah: ' + cheap.title + ' (' + rp(cheap.price) + '). Rating tertinggi: ' + best.title + ' (' + r1(best.rating) + ').', 'Perhatikan juga ukuran dan cara perawatannya sebelum memutuskan.'], chips: ['Yang lebih murah', 'Ada pilihan lain?'] }, ctx: Object.assign({}, chat.ctx, { lastIds: ids }) };
  }
  shop(t, chat) {
    const ctx = chat.ctx || {};
    const budget = parseBudget(t);
    const mats = []; MATRX.forEach(([re, k]) => { if (re.test(t)) mats.push(k); });
    let types = []; const words = [];
    TYPERX.forEach(([re, arr, w]) => { if (re.test(t)) { types = types.concat(arr); words.push(w); } });
    const gift = /hadiah|kado/.test(t) || ctx.awaiting === 'gift';
    const cheaper = /lebih murah|yang murah|termurah/.test(t);
    const other = /pilihan lain|yang lain|lainnya/.test(t);
    const wantsBahan = /\bbahan\b/.test(t);
    const refine = cheaper || other || /^(yang|kalau|terus|oke|ada yang)/.test(t);
    let crit = { budget, mats, types, words, gift };
    if (refine) crit = { budget: budget || ctx.budget || 0, mats: mats.length ? mats : (ctx.mats || []), types: types.length ? types : (ctx.types || []), words: words.length ? words : (ctx.words || []), gift: gift || !!ctx.gift };
    if (cheaper && ctx.lastIds && ctx.lastIds.length) crit.budget = Math.min.apply(null, ctx.lastIds.map((id) => P(id).price)) - 1;
    const nothing = !crit.budget && !crit.mats.length && !crit.types.length;
    if (nothing && gift) return { msg: { role: 'ai', kind: 'clarify', paras: ['Bisa! Supaya pilihannya pas: kira-kira budget-nya berapa, dan temanmu lebih suka barang fashion atau barang untuk kamar dan meja?'], chips: ['Hadiah di bawah Rp100.000', 'Hadiah fashion di bawah Rp150.000', 'Hadiah untuk meja kerja'] }, ctx: { awaiting: 'gift', gift: true } };
    if (nothing && !refine) return { msg: { role: 'ai', kind: 'clarify', paras: ['Aku bisa mencarikan produk dari katalog Rupa. Sebutkan salah satu: budget, jenis barang, material, atau untuk apa barangnya.'], chips: ['Tas di bawah Rp150.000', 'Dekorasi kamar dari kayu', 'Produk berbahan denim bekas'] }, ctx: {} };
    const base = PRODUCTS.filter((p) => p.stock > 0 && (wantsBahan || p.type !== 'bahan'));
    const match = (p, withBudget) => (!withBudget || !crit.budget || p.price <= crit.budget) && (!crit.mats.length || p.mats.some((m) => crit.mats.indexOf(m) >= 0)) && (!crit.types.length || crit.types.indexOf(p.type) >= 0);
    let list = base.filter((p) => match(p, true));
    if (other && ctx.lastIds) list = list.filter((p) => ctx.lastIds.indexOf(p.id) < 0);
    const score = (p) => p.rating * 10 + p.sold / 40 + (crit.gift && p.uses.indexOf('hadiah') >= 0 ? 6 : 0);
    list.sort((a, b) => score(b) - score(a));
    let relaxed = false;
    if (!list.length && crit.budget) { relaxed = true; list = base.filter((p) => match(p, false) && !(other && ctx.lastIds && ctx.lastIds.indexOf(p.id) >= 0)).sort((a, b) => a.price - b.price); }
    const picks = list.slice(0, 3);
    if (!picks.length) return { msg: { role: 'ai', kind: 'clarify', paras: [other ? 'Itu semua pilihan yang cocok di katalog saat ini.' : 'Belum ada produk di katalog yang cocok dengan kriteria itu.', 'Coba longgarkan salah satu: material, jenis barang, atau budget.'], chips: ['Tampilkan produk di bawah Rp100.000', 'Ada produk berbahan kayu?'] }, ctx: Object.assign({}, crit, { lastIds: [] }) };
    const reasons = {};
    picks.forEach((p) => {
      const r = [];
      if (crit.budget && !relaxed) r.push(rp(p.price) + ' — masih di bawah ' + rp(cheaper ? crit.budget + 1 : crit.budget));
      else r.push('Harga ' + rp(p.price));
      r.push((crit.mats.length ? 'Material: ' : 'Dibuat dari ') + p.matShort.toLowerCase() + ' (menurut penjual)');
      if (crit.gift) r.push(p.stock === 1 ? 'Satu-satunya — tidak ada yang sama persis' : 'Rating ' + r1(p.rating) + ' dari ' + p.nrev + ' ulasan');
      else r.push('Rating ' + r1(p.rating) + ' · ' + p.sold + ' terjual');
      reasons[p.id] = r;
    });
    const desc = [];
    if (crit.words.length) desc.push(crit.words[0]);
    if (crit.mats.length) desc.push('berbahan ' + crit.mats.map((m) => MATL[m].toLowerCase()).join(' atau '));
    if (crit.budget && !relaxed) desc.push(cheaper ? 'yang lebih murah dari sebelumnya' : 'di bawah ' + rp(crit.budget));
    const paras = [];

    refs.forEach(([id, fn]) => { const el = document.querySelector('[data-ref="' + id + '"]'); if (el) fn(el); });
    const pg = window.comp.state.page;
    if (location.hash.slice(1) !== pg) history.replaceState(null, '', '#' + pg);
  }
  let pend = false;
  window.__schedule = () => { if (pend) return; pend = true; requestAnimationFrame(() => { pend = false; render(); }); };
  const TEXTLIKE = /^(text|search|email|tel|number|password|url)$/;
  function dispatch(type, e) {
    let el = e.target;
    while (el && el !== document) {
      if (el.nodeType === 1) { const id = el.getAttribute('data-on-' + type); if (id && H[id]) { H[id](e); return; } }
      el = el.parentNode;
    }
  }
  ['click', 'submit', 'dragover', 'dragleave', 'drop', 'keydown', 'keyup'].forEach((t) => document.addEventListener(t, (e) => dispatch(t, e)));
  document.addEventListener('input', (e) => { const t = e.target; if (t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && TEXTLIKE.test(t.type))) dispatch('change', e); });
  document.addEventListener('change', (e) => { const t = e.target; if (t.tagName === 'SELECT' || (t.tagName === 'INPUT' && !TEXTLIKE.test(t.type))) dispatch('change', e); });
  window.__render = render;
})();


const PAGES = ['home','explore','product','sortir','assistant','sell','dash','cart','checkout','success','orders','profile','wishlist','login','register','forgot','openShop','payment','admin'];
const start = PAGES.indexOf(location.hash.slice(1)) >= 0 ? location.hash.slice(1) : 'home';
window.comp = new Component({ startPage: start });
window.__render();
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (PAGES.indexOf(h) >= 0 && h !== window.comp.state.page) window.comp.go(h); });
</script>
